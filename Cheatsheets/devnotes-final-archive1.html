<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>DevNotes</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400;500&family=Outfit:wght@400;500;600;700&display=swap"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css"/>
<style>
/* ═══════════════════════════════════════
   TOKENS
═══════════════════════════════════════ */
:root {
  --bg:        #07090f;
  --surface:   rgba(13,17,28,0.92);
  --surface2:  rgba(17,22,36,0.95);
  --glass:     rgba(255,255,255,0.04);
  --glass-h:   rgba(255,255,255,0.07);
  --border:    rgba(255,255,255,0.07);
  --border-h:  rgba(255,255,255,0.14);
  --text:      #e8edf5;
  --text2:     #7a8699;
  --text3:     #3d4b63;
  --accent:    #4f8ef7;
  --accent-g:  #6366f1;
  --green:     #34d399;
  --gold:      #fbbf24;
  --red:       #f87171;
  --purple:    #a78bfa;
  --r:         12px;
  --r-sm:      8px;
  --r-lg:      16px;
  --mono:      'Geist Mono','Fira Code',monospace;
  --sans:      'Outfit',system-ui,sans-serif;
  /* category palette */
  --c-git:        #f78166;
  --c-bash:       #34d399;
  --c-javascript: #fbbf24;
  --c-python:     #60a5fa;
  --c-docker:     #38bdf8;
  --c-sql:        #c084fc;
  --c-misc:       #6b7280;
  --c-custom:     #fb923c;
}
[data-theme="light"] {
  --bg:        #eef0f7;
  --surface:   rgba(255,255,255,0.94);
  --surface2:  rgba(248,249,254,0.97);
  --glass:     rgba(0,0,0,0.025);
  --glass-h:   rgba(0,0,0,0.05);
  --border:    rgba(0,0,0,0.08);
  --border-h:  rgba(0,0,0,0.16);
  --text:      #111827;
  --text2:     #4b5563;
  --text3:     #9ca3af;
  --accent:    #2563eb;
  --accent-g:  #4f46e5;
  --green:     #059669;
  --gold:      #d97706;
  --red:       #dc2626;
  --purple:    #7c3aed;
}

/* ═══════════════════════════════════════
   RESET + BASE
═══════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  background:var(--bg);
  background-image:
    radial-gradient(ellipse 90% 55% at 10% -8%,  rgba(79,142,247,.08) 0%,transparent 55%),
    radial-gradient(ellipse 70% 50% at 90% 108%, rgba(99,102,241,.07) 0%,transparent 55%),
    radial-gradient(ellipse 40% 30% at 55%  55%, rgba(167,139,250,.03) 0%,transparent 65%);
  background-attachment:fixed;
  color:var(--text);
  font-family:var(--sans);
  font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
[data-theme="light"] body{
  background-image:
    radial-gradient(ellipse 90% 55% at 10% -8%,  rgba(37,99,235,.04) 0%,transparent 55%),
    radial-gradient(ellipse 70% 50% at 90% 108%, rgba(79,70,229,.03) 0%,transparent 55%);
}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:2px;}
[data-theme="light"] ::-webkit-scrollbar-thumb{background:rgba(0,0,0,.15);}

/* ═══════════════════════════════════════
   APP SHELL
═══════════════════════════════════════ */
#app{display:flex;flex-direction:column;height:100vh;overflow:hidden;}

/* ═══════════════════════════════════════
   TOPBAR
═══════════════════════════════════════ */
.topbar{
  display:flex;align-items:center;gap:10px;
  padding:11px 20px;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);
  flex-shrink:0;z-index:20;
}
.brand{
  display:flex;align-items:center;gap:9px;
  font-weight:700;font-size:15.5px;letter-spacing:-.3px;
  text-decoration:none;flex-shrink:0;user-select:none;
}
.brand-icon{
  width:32px;height:32px;border-radius:9px;
  background:linear-gradient(135deg,var(--accent),var(--accent-g));
  display:flex;align-items:center;justify-content:center;
  font-size:16px;color:#fff;
  box-shadow:0 2px 12px rgba(79,142,247,.45);
  flex-shrink:0;transition:box-shadow .2s;
}
.brand:hover .brand-icon{box-shadow:0 4px 20px rgba(79,142,247,.6);}
.brand-name{
  background:linear-gradient(90deg,var(--accent),var(--purple));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}

/* search */
.search-wrap{position:relative;flex:1;max-width:380px;}
.search-wrap .si{
  position:absolute;left:10px;top:50%;transform:translateY(-50%);
  font-size:15px;color:var(--text3);pointer-events:none;transition:color .15s;
}
.search-wrap:focus-within .si{color:var(--accent);}
.search-wrap input{
  width:100%;padding:7px 32px 7px 33px;
  background:var(--glass);border:1px solid var(--border);border-radius:var(--r-sm);
  color:var(--text);font-size:13px;font-family:var(--sans);
  outline:none;transition:border-color .2s,box-shadow .2s,background .2s;
}
.search-wrap input::placeholder{color:var(--text3);}
.search-wrap input:focus{
  border-color:var(--accent);background:var(--glass-h);
  box-shadow:0 0 0 3px rgba(79,142,247,.13);
}
.search-wrap .clr{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);
  background:none;border:none;cursor:pointer;color:var(--text3);
  display:none;padding:2px;border-radius:4px;transition:color .12s;
  align-items:center;justify-content:center;
}
.search-wrap .clr:hover{color:var(--text2);}
.search-wrap input:not(:placeholder-shown)~.clr{display:flex;}
.sep{flex:1;}

/* icon btn */
.ib{
  width:32px;height:32px;display:flex;align-items:center;justify-content:center;
  background:var(--glass);border:1px solid var(--border);
  border-radius:var(--r-sm);cursor:pointer;color:var(--text3);font-size:17px;
  transition:all .18s;flex-shrink:0;
}
.ib:hover{background:var(--glass-h);border-color:var(--border-h);color:var(--text2);}
.ib.on{color:var(--accent);border-color:rgba(79,142,247,.4);background:rgba(79,142,247,.1);}
.vg{display:flex;border:1px solid var(--border);border-radius:var(--r-sm);overflow:hidden;}
.vg .ib{border:none;border-radius:0;border-right:1px solid var(--border);}
.vg .ib:last-child{border-right:none;}

/* add button */
.add-btn{
  display:flex;align-items:center;gap:6px;padding:7px 16px;
  background:linear-gradient(135deg,var(--accent),var(--accent-g));
  border:none;border-radius:var(--r-sm);
  color:#fff;font-size:13px;font-weight:600;font-family:var(--sans);
  cursor:pointer;flex-shrink:0;
  box-shadow:0 2px 14px rgba(79,142,247,.38);
  transition:opacity .15s,transform .14s,box-shadow .2s;
}
.add-btn:hover{opacity:.92;transform:translateY(-1px);box-shadow:0 5px 22px rgba(79,142,247,.5);}
.add-btn:active{transform:translateY(0);}

/* ═══════════════════════════════════════
   FILTERBAR
═══════════════════════════════════════ */
.filterbar{
  display:flex;align-items:center;gap:6px;padding:9px 20px;
  background:var(--surface);border-bottom:1px solid var(--border);
  backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);
  overflow-x:auto;scrollbar-width:none;flex-shrink:0;
}
.filterbar::-webkit-scrollbar{display:none;}
.fpill{
  display:flex;align-items:center;gap:5px;white-space:nowrap;
  padding:4px 13px;border-radius:20px;
  border:1px solid var(--border);background:transparent;
  color:var(--text3);font-size:12px;font-weight:500;
  cursor:pointer;font-family:var(--sans);transition:all .18s;flex-shrink:0;
}
.fpill:hover{color:var(--text2);border-color:var(--border-h);}
.fpill.on{color:var(--text);border-color:rgba(79,142,247,.5);background:rgba(79,142,247,.1);}
.fpill .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.fpill .badge{
  font-size:10px;color:var(--text3);background:var(--glass);
  padding:0 5px;border-radius:8px;margin-left:2px;transition:all .18s;
}
.fpill.on .badge{color:var(--accent);background:rgba(79,142,247,.14);}
.fsep{width:1px;height:16px;background:var(--border);flex-shrink:0;margin:0 3px;}

/* ═══════════════════════════════════════
   MAIN AREA
═══════════════════════════════════════ */
.main{flex:1;overflow-y:auto;padding:20px;}
.stat-line{
  font-size:11px;color:var(--text3);margin-bottom:18px;
  display:flex;align-items:center;gap:8px;
  font-weight:600;letter-spacing:.09em;text-transform:uppercase;
}
.stat-line::after{content:'';flex:1;height:1px;background:var(--border);}

/* ═══════════════════════════════════════
   GRID / LIST
═══════════════════════════════════════ */
.notes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(295px,1fr));gap:15px;}
.notes-list{display:flex;flex-direction:column;gap:11px;}

/* ═══════════════════════════════════════
   CARD — base
   --cc = category color (set inline)
═══════════════════════════════════════ */
.card{
  --cc: rgba(255,255,255,0.1);
  background:var(--surface);
  border:1px solid color-mix(in srgb,var(--cc) 30%,var(--border));
  border-radius:var(--r-lg);overflow:hidden;
  display:flex;flex-direction:column;
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  box-shadow:0 2px 12px rgba(0,0,0,.3),
             0 0 0 0 color-mix(in srgb,var(--cc) 0%,transparent);
  transition:
    border-color .28s ease,
    box-shadow   .28s ease,
    transform    .22s ease;
  animation:cardIn .28s cubic-bezier(.22,.68,0,1.2) both;
  position:relative;
}
/* stagger for first 12 cards */
.card:nth-child(1){animation-delay:.02s}
.card:nth-child(2){animation-delay:.05s}
.card:nth-child(3){animation-delay:.08s}
.card:nth-child(4){animation-delay:.11s}
.card:nth-child(5){animation-delay:.14s}
.card:nth-child(6){animation-delay:.17s}
.card:nth-child(7){animation-delay:.20s}
.card:nth-child(8){animation-delay:.23s}
@keyframes cardIn{
  from{opacity:0;transform:translateY(12px) scale(.97);}
  to  {opacity:1;transform:translateY(0)    scale(1);}
}

/* glow-strip on the left edge */
.card::before{
  content:'';
  position:absolute;top:0;left:0;bottom:0;width:3px;
  background:linear-gradient(180deg,
    color-mix(in srgb,var(--cc) 80%,transparent) 0%,
    color-mix(in srgb,var(--cc) 40%,transparent) 60%,
    transparent 100%);
  border-radius:var(--r-lg) 0 0 var(--r-lg);
  opacity:.7;transition:opacity .28s;pointer-events:none;z-index:1;
}
.card:hover{
  border-color: color-mix(in srgb,var(--cc) 55%,var(--border-h));
  box-shadow:
    0 8px 32px rgba(0,0,0,.45),
    0 0 28px color-mix(in srgb,var(--cc) 18%,transparent),
    0 0 0    1px color-mix(in srgb,var(--cc) 15%,transparent);
  transform:translateY(-3px);
}
.card:hover::before{opacity:1;}
.card.bookmarked{
  border-color:color-mix(in srgb,var(--gold) 40%,var(--cc) 30%);
  box-shadow:0 2px 12px rgba(0,0,0,.3),
             0 0 20px rgba(251,191,36,.07);
}
.card.bookmarked:hover{
  border-color:color-mix(in srgb,var(--gold) 60%,var(--cc) 20%);
  box-shadow:0 8px 32px rgba(0,0,0,.45),
             0 0 30px rgba(251,191,36,.15),
             0 0 28px color-mix(in srgb,var(--cc) 12%,transparent);
}

/* flash animations */
@keyframes copyFlash{
  0%  {box-shadow:0 2px 12px rgba(0,0,0,.3),0 0 0   rgba(52,211,153,0);}
  40% {box-shadow:0 2px 12px rgba(0,0,0,.3),0 0 28px rgba(52,211,153,.4);}
  100%{box-shadow:0 2px 12px rgba(0,0,0,.3),0 0 0   rgba(52,211,153,0);}
}
.card.copy-flash{animation:copyFlash .6s ease forwards;}
@keyframes delShake{
  0%,100%{transform:translateX(0);}
  20%    {transform:translateX(-5px);}
  40%    {transform:translateX(5px);}
  60%    {transform:translateX(-4px);}
  80%    {transform:translateX(4px);}
}
.card.del-shake{animation:delShake .35s ease;}

/* ═══════════════════════════════════════
   CARD HEADER
═══════════════════════════════════════ */
.card-head{
  padding:13px 14px 11px 18px;
  border-bottom:1px solid var(--border);
  display:flex;align-items:flex-start;gap:10px;
}
.card-info{flex:1;min-width:0;}
.card-title{
  font-size:13.5px;font-weight:600;color:var(--text);
  letter-spacing:-.1px;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;margin-bottom:6px;
}
.card-meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
.ctag{
  display:inline-flex;align-items:center;gap:4px;
  font-size:10.5px;font-weight:500;padding:2px 9px;border-radius:20px;
  font-family:var(--mono);letter-spacing:.02em;flex-shrink:0;
  transition:filter .2s;
}
.card:hover .ctag{filter:brightness(1.15);}
.cdate{font-size:11px;color:var(--text3);}
.cedit{font-size:10px;color:var(--text3);font-style:italic;white-space:nowrap;}

/* action buttons */
.card-acts{display:flex;gap:2px;flex-shrink:0;margin-top:-2px;}
.act{
  width:28px;height:28px;display:flex;align-items:center;justify-content:center;
  background:none;border:none;cursor:pointer;border-radius:7px;
  color:var(--text3);font-size:15px;
  transition:background .14s,color .14s,transform .12s;
}
.act:hover{background:var(--glass-h);color:var(--text2);transform:scale(1.15);}
.act:active{transform:scale(.92);}
.act.starred{color:var(--gold);}
.act.ok    {color:var(--green);}
.act.edit-on{color:var(--purple);background:rgba(167,139,250,.12);}
.act.danger{color:var(--red);background:rgba(248,113,113,.12);}

/* ═══════════════════════════════════════
   CARD BODY  +  EXPAND/COLLAPSE
═══════════════════════════════════════ */
.card-body{position:relative;background:var(--surface2);}
.code-pre{
  font-family:var(--mono);font-size:11.5px;line-height:1.85;
  color:var(--text2);white-space:pre-wrap;word-break:break-word;
  padding:12px 14px 12px 18px;margin:0;
  transition:color .2s;
}
.card:hover .code-pre{color:color-mix(in srgb,var(--text2) 85%,var(--text));}

/* collapse wrapper — the key to smooth height animation */
.content-wrap{
  overflow:hidden;
  max-height:165px;
  transition:max-height .42s cubic-bezier(.4,0,.2,1);
  position:relative;
}
.content-wrap.expanded{max-height:3000px;}

/* fade-out cover */
.fade-cover{
  position:absolute;bottom:0;left:0;right:0;height:52px;
  background:linear-gradient(transparent,var(--surface2));
  pointer-events:none;
  transition:opacity .3s;
}
.content-wrap.expanded .fade-cover{opacity:0;pointer-events:none;}

/* expand toggle button */
.expand-btn{
  display:flex;align-items:center;justify-content:center;gap:5px;
  width:100%;padding:7px 0;
  background:transparent;
  border:none;border-top:1px solid var(--border);
  cursor:pointer;font-family:var(--mono);font-size:11px;font-weight:500;
  color:var(--text3);
  transition:background .18s,color .18s;
  letter-spacing:.04em;
}
.expand-btn:hover{
  background:color-mix(in srgb,var(--cc) 8%,var(--glass));
  color:color-mix(in srgb,var(--cc) 80%,var(--text2));
}
.expand-btn i{
  font-size:14px;
  transition:transform .38s cubic-bezier(.4,0,.2,1);
}
.expand-btn.open i{transform:rotate(180deg);}

/* line counter badge */
.line-badge{
  font-size:10px;padding:1px 7px;border-radius:20px;
  background:color-mix(in srgb,var(--cc) 14%,var(--glass));
  color:color-mix(in srgb,var(--cc) 70%,var(--text3));
  border:1px solid color-mix(in srgb,var(--cc) 20%,transparent);
  margin-left:auto;margin-right:12px;
  transition:all .18s;
}
.expand-btn:hover .line-badge{
  background:color-mix(in srgb,var(--cc) 22%,var(--glass));
}

/* ═══════════════════════════════════════
   INLINE EDIT
═══════════════════════════════════════ */
.inline-edit-wrap{
  background:var(--surface2);border-top:1px solid var(--border);
  padding:12px 13px 13px 17px;display:flex;flex-direction:column;gap:8px;
  animation:slideDown .2s cubic-bezier(.22,.68,0,1.1);
}
@keyframes slideDown{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:translateY(0);}}
.ie-title,.ie-content{
  width:100%;background:var(--glass);border:1px solid var(--border);
  border-radius:var(--r-sm);color:var(--text);font-family:var(--sans);
  outline:none;transition:border-color .18s,box-shadow .18s,background .18s;
}
.ie-title{padding:7px 10px;font-size:13px;font-weight:600;}
.ie-title:focus{
  border-color:var(--purple);background:var(--glass-h);
  box-shadow:0 0 0 3px rgba(167,139,250,.13);
}
.ie-content{
  padding:8px 10px;font-size:11.5px;font-family:var(--mono);
  line-height:1.8;color:var(--text2);resize:none;min-height:90px;overflow:hidden;
}
.ie-content:focus{
  border-color:var(--purple);background:var(--glass-h);
  box-shadow:0 0 0 3px rgba(167,139,250,.13);
}
.ie-row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.ie-hint{font-size:11px;color:var(--text3);}
kbd{
  background:var(--glass);border:1px solid var(--border);
  border-radius:4px;padding:1px 6px;font-size:10px;
  font-family:var(--mono);color:var(--text2);
}
.ie-actions{display:flex;gap:7px;}
.ie-cancel{
  padding:5px 14px;border:1px solid var(--border);border-radius:var(--r-sm);
  background:transparent;color:var(--text3);font-size:12px;font-weight:500;
  font-family:var(--sans);cursor:pointer;transition:all .15s;
}
.ie-cancel:hover{border-color:var(--border-h);color:var(--text2);}
.ie-save{
  padding:5px 16px;border:none;border-radius:var(--r-sm);
  background:linear-gradient(135deg,var(--purple),var(--accent-g));
  color:#fff;font-size:12px;font-weight:600;font-family:var(--sans);
  cursor:pointer;box-shadow:0 2px 10px rgba(167,139,250,.32);
  transition:opacity .14s,transform .12s,box-shadow .2s;
}
.ie-save:hover{opacity:.88;transform:translateY(-1px);box-shadow:0 4px 16px rgba(167,139,250,.45);}
.ie-save:disabled{opacity:.3;cursor:not-allowed;transform:none;box-shadow:none;}

/* ═══════════════════════════════════════
   EMPTY
═══════════════════════════════════════ */
.empty{text-align:center;padding:80px 20px;color:var(--text3);}
.empty-icon{
  width:64px;height:64px;border-radius:20px;
  background:var(--glass);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 16px;font-size:28px;color:var(--text3);
  animation:float 3s ease-in-out infinite;
}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
.empty h3{font-size:15px;font-weight:600;color:var(--text2);margin-bottom:6px;}
.empty p{font-size:13px;}

/* ═══════════════════════════════════════
   MODAL
═══════════════════════════════════════ */
.overlay{
  display:none;position:fixed;inset:0;z-index:100;
  background:rgba(0,0,0,.7);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  align-items:flex-start;justify-content:center;
  padding:6vh 20px 40px;overflow-y:auto;
}
.overlay.open{display:flex;}
.modal{
  background:var(--surface);
  border:1px solid var(--border-h);border-radius:var(--r-lg);
  padding:26px;width:100%;max-width:540px;flex-shrink:0;
  box-shadow:0 24px 80px rgba(0,0,0,.65),0 0 40px rgba(79,142,247,.1);
  animation:modalIn .24s cubic-bezier(.16,1,.3,1);
}
@keyframes modalIn{from{opacity:0;transform:translateY(20px) scale(.97);}to{opacity:1;transform:none;}}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;}
.modal-head-left{display:flex;align-items:center;gap:10px;}
.modal-head h2{font-size:16px;font-weight:700;color:var(--text);letter-spacing:-.2px;}
.mbadge{font-size:11px;font-weight:600;padding:2px 10px;border-radius:20px;}
.mbadge-new {background:rgba(79,142,247,.15);color:var(--accent);}
.mbadge-edit{background:rgba(167,139,250,.15);color:var(--purple);}
.field{margin-bottom:16px;}
.flabel{
  display:block;font-size:11px;font-weight:600;color:var(--text3);
  text-transform:uppercase;letter-spacing:.07em;margin-bottom:7px;
}
.finput,.ftextarea{
  width:100%;padding:9px 12px;
  background:var(--glass);border:1px solid var(--border);
  border-radius:var(--r-sm);color:var(--text);
  font-size:13px;font-family:var(--sans);outline:none;
  transition:border-color .18s,box-shadow .18s,background .18s;
}
.finput::placeholder,.ftextarea::placeholder{color:var(--text3);}
.finput:focus,.ftextarea:focus{
  border-color:var(--accent);background:var(--glass-h);
  box-shadow:0 0 0 3px rgba(79,142,247,.13);
}
.ftextarea{
  font-family:var(--mono);font-size:12px;resize:vertical;
  min-height:145px;line-height:1.8;color:var(--text2);
}
.cat-row{display:flex;flex-wrap:wrap;gap:6px;}
.cpill{
  padding:4px 13px;border-radius:20px;
  border:1px solid var(--border);background:transparent;
  color:var(--text3);font-size:12px;font-weight:500;
  cursor:pointer;font-family:var(--sans);transition:all .18s;
}
.cpill:hover{color:var(--text2);border-color:var(--border-h);}
.cpill.sel{border-color:rgba(79,142,247,.5);color:var(--accent);background:rgba(79,142,247,.1);}
.form-actions{
  display:flex;gap:8px;justify-content:flex-end;
  margin-top:20px;padding-top:18px;border-top:1px solid var(--border);
}
.btn-cancel{
  padding:8px 18px;border:1px solid var(--border);border-radius:var(--r-sm);
  background:transparent;color:var(--text3);font-size:13px;font-weight:500;
  cursor:pointer;font-family:var(--sans);transition:all .15s;
}
.btn-cancel:hover{border-color:var(--border-h);color:var(--text2);}
.btn-save{
  padding:8px 22px;border:none;border-radius:var(--r-sm);
  background:linear-gradient(135deg,var(--accent),var(--accent-g));
  color:#fff;font-size:13px;font-weight:600;font-family:var(--sans);cursor:pointer;
  box-shadow:0 2px 14px rgba(79,142,247,.38);
  transition:opacity .14s,transform .12s,box-shadow .2s;
}
.btn-save:hover{opacity:.9;transform:translateY(-1px);box-shadow:0 5px 20px rgba(79,142,247,.5);}
.btn-save:disabled{opacity:.3;cursor:not-allowed;transform:none;box-shadow:none;}
.btn-save.edit-mode{
  background:linear-gradient(135deg,var(--purple),var(--accent-g));
  box-shadow:0 2px 14px rgba(167,139,250,.38);
}
.btn-save.edit-mode:hover{box-shadow:0 5px 20px rgba(167,139,250,.5);}
</style>
</head>
<body data-theme="dark">

<!-- ══ MODAL ══════════════════════════════════════════════════ -->
<div class="overlay" id="overlay" onclick="onOverlayClick(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-head">
      <div class="modal-head-left">
        <h2 id="m-title">New note</h2>
        <span class="mbadge mbadge-new" id="m-badge">Add</span>
      </div>
      <button class="act" onclick="closeModal()" aria-label="Close modal"><i class="ti ti-x" aria-hidden="true"></i></button>
    </div>
    <div class="field">
      <label class="flabel">Title</label>
      <input id="f-title" class="finput" placeholder="e.g. Git stash commands" autocomplete="off"/>
    </div>
    <div class="field">
      <label class="flabel">Category</label>
      <div class="cat-row" id="f-cats"></div>
      <input id="f-custom" class="finput" placeholder="Custom category name…" style="margin-top:8px;display:none;" autocomplete="off"/>
    </div>
    <div class="field" style="margin-bottom:0">
      <label class="flabel">Content</label>
      <textarea id="f-content" class="ftextarea" placeholder="# paste your commands or notes here…"></textarea>
    </div>
    <div class="form-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" id="f-save" onclick="saveNote()" disabled>
        <span id="f-save-lbl">Save note</span>
      </button>
    </div>
  </div>
</div>

<!-- ══ APP ═════════════════════════════════════════════════════ -->
<div id="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-icon" aria-hidden="true"><i class="ti ti-terminal-2"></i></div>
      <span class="brand-name">DevNotes</span>
    </div>
    <div class="search-wrap">
      <i class="ti ti-search si" aria-hidden="true"></i>
      <input type="text" id="search-in" placeholder="Search notes…" oninput="onSearch(this.value)" autocomplete="off" aria-label="Search notes"/>
      <button class="clr" onclick="clearSearch()" aria-label="Clear search"><i class="ti ti-x" style="font-size:12px;" aria-hidden="true"></i></button>
    </div>
    <div class="sep"></div>
    <div class="vg" role="group" aria-label="View mode">
      <button class="ib on" id="vgb" onclick="setView('grid')" title="Grid view"  aria-label="Grid view"><i class="ti ti-layout-grid" aria-hidden="true"></i></button>
      <button class="ib"    id="vlb" onclick="setView('list')" title="List view"   aria-label="List view"><i class="ti ti-list"         aria-hidden="true"></i></button>
    </div>
    <button class="ib" id="theme-btn" onclick="toggleTheme()" title="Toggle theme" aria-label="Toggle theme"><i class="ti ti-sun" aria-hidden="true"></i></button>
    <button class="add-btn" onclick="openModal()"><i class="ti ti-plus" aria-hidden="true"></i> Add note</button>
  </header>

  <div class="filterbar" id="filterbar" role="navigation" aria-label="Filter notes"></div>

  <main class="main">
    <p class="stat-line" id="stat" aria-live="polite"></p>
    <div id="notes-con" class="notes-grid" role="list"></div>
    <div id="empty" class="empty" style="display:none;" aria-live="polite">
      <div class="empty-icon" aria-hidden="true"><i class="ti ti-notes"></i></div>
      <h3>No notes yet</h3>
      <p>Hit <strong>Add note</strong> or press <kbd>Ctrl+N</kbd></p>
    </div>
  </main>
</div>

<script>
/* ═══════════════════════════════════════
   STATE
═══════════════════════════════════════ */
let notes    = [];
let filter   = 'all';
let search   = '';
let view     = 'grid';
let formCat  = 'git';
let editId   = null;
let inlineId = null;
let delArm   = null, delT = null;
let copied   = null;
let theme    = 'dark';
const expanded = new Set();   /* IDs of expanded cards — persists across renders */

const PRESETS = ['git','bash','javascript','python','docker','sql','misc'];

/* category → hex color */
const CAT_COLOR = {
  git:'#f78166', bash:'#34d399', javascript:'#fbbf24',
  python:'#60a5fa', docker:'#38bdf8', sql:'#c084fc',
  misc:'#6b7280', custom:'#fb923c'
};
function catClr(c){ return CAT_COLOR[c] || '#fb923c'; }
function tagStyle(c){
  const cl=catClr(c);
  return `background:color-mix(in srgb,${cl} 13%,transparent);color:${cl};border:1px solid color-mix(in srgb,${cl} 24%,transparent);`;
}

/* ─── SAMPLE DATA ── */
const SAMPLES = [
  {id:'s1',title:'Git stash commands',
   content:`git stash                    # save working tree
git stash pop                # restore last stash
git stash list               # list all stashes
git stash apply stash@{0}   # apply specific stash
git stash drop  stash@{0}   # remove specific stash
git stash clear              # remove all stashes
git stash show -p            # show stash diff
git stash branch <name>      # create branch from stash`,
   category:'git',bookmarked:true,createdAt:new Date(Date.now()-172800000).toISOString(),updatedAt:null},
  {id:'s2',title:'Git branch operations',
   content:`# Create & switch
git checkout -b feature/my-branch
git switch   -c feature/my-branch

# Delete local & remote
git branch -d branch-name
git push origin --delete branch-name

# Rename current branch
git branch -m old-name new-name

# List all branches
git branch -a`,
   category:'git',bookmarked:false,createdAt:new Date(Date.now()-345600000).toISOString(),updatedAt:null},
  {id:'s3',title:'Docker cleanup commands',
   content:`# Stop all running containers
docker stop $(docker ps -q)

# Remove all containers
docker rm $(docker ps -aq)

# Full system prune
docker system prune -a --volumes

# Dangling images only
docker image prune

# Check disk usage
docker system df`,
   category:'docker',bookmarked:false,createdAt:new Date(Date.now()-432000000).toISOString(),updatedAt:null},
  {id:'s4',title:'npm useful commands',
   content:`npm list -g --depth=0       # list global packages
npm outdated               # check outdated deps
npm audit fix              # auto-fix vulnerabilities
npm cache clean --force    # clear npm cache
npx kill-port 3000         # kill process on port`,
   category:'bash',bookmarked:false,createdAt:new Date(Date.now()-86400000).toISOString(),updatedAt:null},
];

/* ═══════════════════════════════════════
   STORAGE (localStorage)
═══════════════════════════════════════ */
const LS = 'devnotes-v6';
function loadData(){
  try{
    const raw=localStorage.getItem(LS);
    if(raw){
      const d=JSON.parse(raw);
      notes=d.notes?.length?d.notes:[...SAMPLES];
      view =d.view||'grid';
      theme=d.theme||'dark';
    } else { notes=[...SAMPLES]; }
  } catch(e){ notes=[...SAMPLES]; }
  applyTheme(); applyView(); render();
}
function persist(){
  try{ localStorage.setItem(LS,JSON.stringify({notes,view,theme})); }catch(e){}
}
window.addEventListener('beforeunload',persist);

/* ═══════════════════════════════════════
   THEME
═══════════════════════════════════════ */
function applyTheme(){
  document.body.setAttribute('data-theme',theme);
  document.getElementById('theme-btn').innerHTML=
    theme==='dark'
      ?'<i class="ti ti-sun" aria-hidden="true"></i>'
      :'<i class="ti ti-moon" aria-hidden="true"></i>';
}
function toggleTheme(){ theme=theme==='dark'?'light':'dark'; applyTheme(); persist(); }

/* ═══════════════════════════════════════
   VIEW
═══════════════════════════════════════ */
function setView(v){ view=v; applyView(); persist(); render(); }
function applyView(){
  document.getElementById('vgb').className='ib'+(view==='grid'?' on':'');
  document.getElementById('vlb').className='ib'+(view==='list'?' on':'');
  const c=document.getElementById('notes-con');
  if(c) c.className=view==='grid'?'notes-grid':'notes-list';
}

/* ═══════════════════════════════════════
   FILTER / SEARCH
═══════════════════════════════════════ */
function onSearch(v){ search=v; render(); }
function clearSearch(){ document.getElementById('search-in').value=''; search=''; render(); }
function setFilter(f){ filter=f; render(); }
function getFiltered(){
  return notes.filter(n=>{
    const q=search.toLowerCase();
    const ms=!q||n.title.toLowerCase().includes(q)||n.content.toLowerCase().includes(q)||n.category.toLowerCase().includes(q);
    const mf=filter==='all'?true:filter==='bookmarked'?n.bookmarked:n.category===filter;
    return ms&&mf;
  });
}

/* ═══════════════════════════════════════
   UTILS
═══════════════════════════════════════ */
function esc(s){
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmtDate(iso){
  if(!iso) return '';
  const d=new Date(iso), now=new Date(), diff=(now-d)/1000;
  if(diff<60)     return 'just now';
  if(diff<3600)   return Math.floor(diff/60)+'m ago';
  if(diff<86400)  return Math.floor(diff/3600)+'h ago';
  if(diff<604800) return Math.floor(diff/86400)+'d ago';
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
}
const COLLAPSE_LINES = 7;   /* lines threshold for showing expand toggle */

/* ═══════════════════════════════════════
   RENDER
═══════════════════════════════════════ */
function renderFilterBar(){
  const cats=[...new Set(notes.map(n=>n.category))];
  const bc=notes.filter(n=>n.bookmarked).length;
  let h=`
    <button class="fpill ${filter==='all'?'on':''}" onclick="setFilter('all')">
      <i class="ti ti-notes" style="font-size:12px;" aria-hidden="true"></i> All
      <span class="badge">${notes.length}</span>
    </button>
    <button class="fpill ${filter==='bookmarked'?'on':''}" onclick="setFilter('bookmarked')">
      <i class="ti ti-star" style="font-size:12px;${filter==='bookmarked'?'color:var(--gold)':''}" aria-hidden="true"></i> Bookmarked
      <span class="badge">${bc}</span>
    </button>`;
  if(cats.length) h+=`<div class="fsep" aria-hidden="true"></div>`;
  h+=cats.map(cat=>{
    const cnt=notes.filter(n=>n.category===cat).length;
    const cl=catClr(cat);
    return `<button class="fpill ${filter===cat?'on':''}" onclick="setFilter('${esc(cat)}')"
      style="${filter===cat?`border-color:color-mix(in srgb,${cl} 50%,transparent);background:color-mix(in srgb,${cl} 10%,transparent);color:${cl};`:''}">
      <span class="dot" style="background:${cl};width:6px;height:6px;border-radius:50%;flex-shrink:0;" aria-hidden="true"></span>
      ${esc(cat)} <span class="badge">${cnt}</span>
    </button>`;
  }).join('');
  document.getElementById('filterbar').innerHTML=h;
}

function renderNotes(){
  const list=getFiltered();
  const con=document.getElementById('notes-con');
  const empty=document.getElementById('empty');
  document.getElementById('stat').textContent=
    `${list.length} ${list.length===1?'note':'notes'}${search?` matching "${search}"`:''}`;
  if(!list.length){ con.innerHTML=''; empty.style.display='block'; return; }
  empty.style.display='none';

  con.innerHTML=list.map(n=>{
    const isCopied  = copied===n.id;
    const isDel     = delArm===n.id;
    const isInline  = inlineId===n.id;
    const isExpanded= expanded.has(n.id);
    const lines     = n.content.split('\n').length;
    const needToggle= view==='grid' && lines > COLLAPSE_LINES && !isInline;
    const cc        = catClr(n.category);

    return `<article class="card ${n.bookmarked?'bookmarked':''}" id="card-${n.id}"
        role="listitem" style="--cc:${cc}">
      <div class="card-head">
        <div class="card-info">
          <div class="card-title" title="${esc(n.title)}">${esc(n.title)}</div>
          <div class="card-meta">
            <span class="ctag" style="${tagStyle(n.category)}">
              <span style="width:5px;height:5px;border-radius:50%;background:${cc};flex-shrink:0;" aria-hidden="true"></span>
              ${esc(n.category)}
            </span>
            <span class="cdate">${fmtDate(n.createdAt)}</span>
            ${n.updatedAt?`<span class="cedit">· edited ${fmtDate(n.updatedAt)}</span>`:''}
          </div>
        </div>
        <div class="card-acts" role="group" aria-label="Note actions">
          <button class="act ${n.bookmarked?'starred':''}" onclick="toggleBookmark('${n.id}')"
            title="${n.bookmarked?'Remove bookmark':'Bookmark'}" aria-pressed="${n.bookmarked}">
            <i class="ti ti-star" aria-hidden="true"></i></button>
          <button class="act ${isInline?'edit-on':''}" onclick="toggleInline('${n.id}')"
            title="Quick edit" aria-label="Quick edit" aria-pressed="${isInline}">
            <i class="ti ti-pencil" aria-hidden="true"></i></button>
          <button class="act" onclick="openEditModal('${n.id}')"
            title="Edit in modal" aria-label="Edit in modal">
            <i class="ti ti-edit" aria-hidden="true"></i></button>
          <button class="act ${isCopied?'ok':''}" onclick="copyNote('${n.id}')"
            title="Copy content" aria-label="Copy content">
            <i class="ti ${isCopied?'ti-check':'ti-copy'}" aria-hidden="true"></i></button>
          <button class="act ${isDel?'danger':''}" onclick="deleteNote('${n.id}')"
            title="${isDel?'Click again to confirm':'Delete'}" aria-label="${isDel?'Confirm delete':'Delete'}">
            <i class="ti ti-trash" aria-hidden="true"></i></button>
        </div>
      </div>
      <div class="card-body">
        <div class="content-wrap ${isExpanded?'expanded':''}" id="cw-${n.id}">
          <pre class="code-pre">${esc(n.content)}</pre>
          ${needToggle&&!isExpanded?`<div class="fade-cover" aria-hidden="true"></div>`:''}
        </div>
      </div>
      ${needToggle?`
      <button class="expand-btn ${isExpanded?'open':''}"
        onclick="toggleExpand('${n.id}')" aria-expanded="${isExpanded}"
        aria-controls="cw-${n.id}">
        <i class="ti ti-chevron-down" aria-hidden="true"></i>
        <span>${isExpanded?'Show less':'Show more'}</span>
        <span class="line-badge">${lines} lines</span>
      </button>`:''}
      ${isInline?`
      <div class="inline-edit-wrap" id="ie-${n.id}">
        <input  class="ie-title"   id="ie-t-${n.id}" value="${esc(n.title)}" placeholder="Title" oninput="ieCheck('${n.id}')"/>
        <textarea class="ie-content" id="ie-c-${n.id}" oninput="ieCheck('${n.id}')">${esc(n.content)}</textarea>
        <div class="ie-row">
          <span class="ie-hint"><kbd>Esc</kbd> to cancel</span>
          <div class="ie-actions">
            <button class="ie-cancel" onclick="cancelInline()">Cancel</button>
            <button class="ie-save" id="ie-s-${n.id}" onclick="saveInline('${n.id}')">Save changes</button>
          </div>
        </div>
      </div>`:''}
    </article>`;
  }).join('');

  /* restore inline textarea height */
  if(inlineId){
    setTimeout(()=>{
      const ta=document.getElementById(`ie-c-${inlineId}`);
      if(ta){ ta.style.height='auto'; ta.style.height=ta.scrollHeight+'px'; }
    },20);
  }
}

function render(){ renderFilterBar(); renderNotes(); }

/* ═══════════════════════════════════════
   EXPAND / COLLAPSE  (no re-render!)
═══════════════════════════════════════ */
function toggleExpand(id){
  const cw  = document.getElementById(`cw-${id}`);
  const btn = cw?.closest('.card')?.querySelector('.expand-btn');
  const fc  = cw?.querySelector('.fade-cover');
  if(!cw) return;

  if(expanded.has(id)){
    expanded.delete(id);
    cw.classList.remove('expanded');
    if(btn){
      btn.classList.remove('open');
      btn.setAttribute('aria-expanded','false');
      btn.querySelector('span:not(.line-badge)').textContent='Show more';
    }
    /* re-add fade cover after transition */
    if(fc) fc.style.opacity='';
    setTimeout(()=>{
      if(fc) fc.style.opacity='';
      /* scroll card into view if it's now shorter */
      cw.closest('.card')?.scrollIntoView({behavior:'smooth',block:'nearest'});
    }, 440);
  } else {
    expanded.add(id);
    cw.classList.add('expanded');
    if(fc) fc.style.opacity='0';
    if(btn){
      btn.classList.add('open');
      btn.setAttribute('aria-expanded','true');
      btn.querySelector('span:not(.line-badge)').textContent='Show less';
    }
  }
}

/* ═══════════════════════════════════════
   ACTIONS
═══════════════════════════════════════ */
function toggleBookmark(id){
  notes=notes.map(n=>n.id===id?{...n,bookmarked:!n.bookmarked}:n);
  persist(); render();
}

function copyNote(id){
  const n=notes.find(n=>n.id===id); if(!n) return;
  const done=()=>{
    copied=id; render();
    /* flash the card green */
    requestAnimationFrame(()=>{
      const card=document.getElementById(`card-${id}`);
      if(card){ card.classList.remove('copy-flash'); void card.offsetWidth; card.classList.add('copy-flash'); }
    });
    setTimeout(()=>{ copied=null; render(); },2000);
  };
  if(navigator.clipboard){ navigator.clipboard.writeText(n.content).then(done).catch(()=>{fbCopy(n.content);done();}); }
  else { fbCopy(n.content); done(); }
}
function fbCopy(txt){
  const el=document.createElement('textarea');
  el.value=txt; el.style.cssText='position:absolute;left:-9999px;';
  document.body.appendChild(el); el.select();
  document.execCommand('copy'); document.body.removeChild(el);
}

function deleteNote(id){
  if(delArm===id){
    notes=notes.filter(n=>n.id!==id);
    expanded.delete(id);
    if(inlineId===id) inlineId=null;
    delArm=null; clearTimeout(delT); persist(); render();
  } else {
    delArm=id; clearTimeout(delT);
    /* shake the card */
    const card=document.getElementById(`card-${id}`);
    if(card){ card.classList.remove('del-shake'); void card.offsetWidth; card.classList.add('del-shake'); }
    delT=setTimeout(()=>{ delArm=null; render(); },3000);
    render();
  }
}

/* ═══════════════════════════════════════
   INLINE EDIT
═══════════════════════════════════════ */
function toggleInline(id){
  inlineId=inlineId===id?null:id; render();
  if(inlineId){
    setTimeout(()=>{
      const t=document.getElementById(`ie-t-${id}`); if(t) t.focus();
      const ta=document.getElementById(`ie-c-${id}`);
      if(ta){ ta.style.height='auto'; ta.style.height=ta.scrollHeight+'px'; }
    },40);
  }
}
function cancelInline(){ inlineId=null; render(); }
function ieCheck(id){
  const t=(document.getElementById(`ie-t-${id}`)?.value||'').trim();
  const c=(document.getElementById(`ie-c-${id}`)?.value||'').trim();
  const btn=document.getElementById(`ie-s-${id}`);
  if(btn) btn.disabled=!t||!c;
  const ta=document.getElementById(`ie-c-${id}`);
  if(ta){ ta.style.height='auto'; ta.style.height=ta.scrollHeight+'px'; }
}
function saveInline(id){
  const t=(document.getElementById(`ie-t-${id}`)?.value||'').trim();
  const c=(document.getElementById(`ie-c-${id}`)?.value||'').trim();
  if(!t||!c) return;
  notes=notes.map(n=>n.id===id?{...n,title:t,content:c,updatedAt:new Date().toISOString()}:n);
  inlineId=null; persist(); render();
}

/* ═══════════════════════════════════════
   MODAL
═══════════════════════════════════════ */
function openModal(){
  editId=null; formCat='git';
  document.getElementById('f-title').value='';
  document.getElementById('f-content').value='';
  document.getElementById('f-custom').value='';
  document.getElementById('m-title').textContent='New note';
  document.getElementById('m-badge').textContent='Add';
  document.getElementById('m-badge').className='mbadge mbadge-new';
  document.getElementById('f-save').className='btn-save';
  document.getElementById('f-save').disabled=true;
  document.getElementById('f-save-lbl').textContent='Save note';
  renderFormCats();
  document.getElementById('overlay').classList.add('open');
  setTimeout(()=>document.getElementById('f-title').focus(),60);
}
function openEditModal(id){
  const n=notes.find(n=>n.id===id); if(!n) return;
  editId=id;
  formCat=PRESETS.includes(n.category)?n.category:'custom';
  document.getElementById('f-title').value=n.title;
  document.getElementById('f-content').value=n.content;
  document.getElementById('f-custom').value=!PRESETS.includes(n.category)?n.category:'';
  document.getElementById('m-title').textContent='Edit note';
  document.getElementById('m-badge').textContent='Edit';
  document.getElementById('m-badge').className='mbadge mbadge-edit';
  document.getElementById('f-save').className='btn-save edit-mode';
  document.getElementById('f-save').disabled=false;
  document.getElementById('f-save-lbl').textContent='Save changes';
  renderFormCats();
  document.getElementById('overlay').classList.add('open');
  setTimeout(()=>document.getElementById('f-title').focus(),60);
}
function closeModal(){ document.getElementById('overlay').classList.remove('open'); editId=null; }
function onOverlayClick(e){ if(e.target.id==='overlay') closeModal(); }

function renderFormCats(){
  const extra=[...new Set(notes.map(n=>n.category))].filter(c=>!PRESETS.includes(c));
  const cats=[...PRESETS,...extra,'custom'];
  document.getElementById('f-cats').innerHTML=cats.map(c=>
    `<button class="cpill ${formCat===c?'sel':''}" onclick="pickCat('${esc(c)}')" type="button">${esc(c)}</button>`
  ).join('');
  document.getElementById('f-custom').style.display=formCat==='custom'?'block':'none';
  updateSaveBtn();
}
function pickCat(c){ formCat=c; renderFormCats(); }
function updateSaveBtn(){
  const t=document.getElementById('f-title').value.trim();
  const c=document.getElementById('f-content').value.trim();
  const cat=formCat==='custom'?document.getElementById('f-custom').value.trim():formCat;
  document.getElementById('f-save').disabled=!t||!c||!cat;
}

document.addEventListener('DOMContentLoaded',()=>{
  ['f-title','f-content','f-custom'].forEach(id=>
    document.getElementById(id).addEventListener('input',updateSaveBtn));
});

function saveNote(){
  const title  =document.getElementById('f-title').value.trim();
  const content=document.getElementById('f-content').value.trim();
  const cat    =formCat==='custom'?document.getElementById('f-custom').value.trim().toLowerCase():formCat;
  if(!title||!content||!cat) return;
  if(editId){
    notes=notes.map(n=>n.id===editId?{...n,title,content,category:cat,updatedAt:new Date().toISOString()}:n);
  } else {
    notes=[{id:Date.now().toString(),title,content,category:cat,
             bookmarked:false,createdAt:new Date().toISOString(),updatedAt:null},...notes];
  }
  persist(); closeModal(); render();
}

/* ═══════════════════════════════════════
   KEYBOARD SHORTCUTS
═══════════════════════════════════════ */
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key==='n'){ e.preventDefault(); openModal(); }
  if(e.key==='Escape'){
    if(document.getElementById('overlay').classList.contains('open')) closeModal();
    else if(inlineId){ inlineId=null; render(); }
  }
});

/* ═══════════════════════════════════════
   INIT
═══════════════════════════════════════ */
loadData();
</script>
</body>
</html>
