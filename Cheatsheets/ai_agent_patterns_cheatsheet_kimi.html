    <!-- Search & Filters -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">

        <div id="empty-state" class="hidden text-center py-20">

                <svg class="w-8 h-8 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>

    <!-- Toast -->

            <svg class="w-5 h-5 text-green-400 dark:text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
            <span id="toast-msg" class="font-medium text-sm">Copied to clipboard!</span>

<script>
// ================= DATA =================
const allTags = [
    { id: 'all', label: 'All', color: 'bg-slate-800 text-white dark:bg-white dark:text-slate-900' },
    { id: 'architecture', label: 'Architecture', color: 'bg-blue-100 text-blue-800 dark:bg-blue-900/30 dark:text-blue-300' },
    { id: 'prompting', label: 'Prompting', color: 'bg-purple-100 text-purple-800 dark:bg-purple-900/30 dark:text-purple-300' },
    { id: 'testing', label: 'Testing', color: 'bg-green-100 text-green-800 dark:bg-green-900/30 dark:text-green-300' },
    { id: 'workflow', label: 'Workflow', color: 'bg-orange-100 text-orange-800 dark:bg-orange-900/30 dark:text-orange-300' },
    { id: 'enterprise', label: 'Enterprise', color: 'bg-red-100 text-red-800 dark:bg-red-900/30 dark:text-red-300' },
    { id: 'tools', label: 'Tools & Functions', color: 'bg-cyan-100 text-cyan-800 dark:bg-cyan-900/30 dark:text-cyan-300' },
    { id: 'memory', label: 'Memory', color: 'bg-amber-100 text-amber-800 dark:bg-amber-900/30 dark:text-amber-300' },
    { id: 'beginner', label: 'Beginner', color: 'bg-emerald-100 text-emerald-800 dark:bg-emerald-900/30 dark:text-emerald-300' },
    { id: 'advanced', label: 'Advanced', color: 'bg-rose-100 text-rose-800 dark:bg-rose-900/30 dark:text-rose-300' },
];

const patterns = [
    {
        id: 'react',
        title: 'ReAct (Reason + Act)',
        tags: ['architecture', 'tools', 'advanced', 'workflow'],
        difficulty: 'Advanced',
        description: 'The agent alternates between reasoning about the problem and taking actions using tools. This creates an iterative loop of thought → action → observation until the task is complete.',
        whenToUse: 'Complex multi-step tasks requiring external tools, web search, calculators, APIs, or database lookups. Best when the solution path is not known upfront.',
        diagram: `graph TD
    A[User Query] --> B[Thought: What do I need?]
    B --> C{Need Tool?}
    C -->|Yes| D[Action: Call Tool]
    D --> E[Observation: Result]
    E --> B
    C -->|No| F[Final Answer]`,
        prompt: `You are a helpful assistant. Solve the following question by interleaving Thought, Action, and Observation steps.

Available tools:
- search(query): Searches the web
- calculator(expression): Evaluates math

Format your response as:
Thought: [your reasoning]
Action: [tool_name]([input])
Observation: [result will be inserted]
... (repeat as needed)
Thought: [final reasoning]
Final Answer: [your answer]

Question: {{question}}`,
        code: `class ReActAgent:
    def run(self, query, max_steps=10):
        for step in range(max_steps):
            thought = self.llm(f"Thought for: {query}")
            if "Final Answer:" in thought:
                return thought.split("Final Answer:")[1].strip()
            action = parse_action(thought)
            obs = self.tools.execute(action)
            query += f"\nObservation: {obs}"
        return "Max steps reached"`,
        testing: `• Test with questions requiring 0, 1, and 5+ tool calls
• Verify halt condition — agent must stop when answer found
• Inject tool failures to test recovery behavior
• Measure token usage per step to optimize cost`
    },
    {
        id: 'prompt-chaining',
        title: 'Prompt Chaining (Sequential Pipeline)',
        tags: ['architecture', 'beginner', 'workflow'],
        difficulty: 'Beginner',
        description: 'Decompose a complex task into a sequence of simpler sub-tasks, where the output of each LLM call feeds into the next. Each stage validates and transforms data before passing it forward.',
        whenToUse: 'Tasks with clear sequential dependencies: content generation with review, data extraction then summarization, multi-stage document processing.',
        diagram: `graph LR
    A[Input] -->|Raw Text| B[LLM Call 1<br/>Extract Entities]
    B -->|Entities| C[Gate/Validator]
    C -->|Pass| D[LLM Call 2<br/>Summarize]
    C -->|Fail| E[Error Handler]
    D -->|Summary| F[LLM Call 3<br/>Format Output]
    F --> G[Final Output]`,
        prompt: `// Stage 1: Extraction
Extract all named entities, dates, and monetary values from the following text. Return as JSON.
Text: {{input}}

// Stage 2: Summarization (uses Stage 1 output)
Given these entities: {{stage1_output}}
Write a 2-sentence executive summary.

// Stage 3: Formatting (uses Stage 2 output)
Format this summary into a markdown report with headers.`,
        code: `def pipeline(input_text):
    entities = llm_call(prompt_extract, input=input_text)
    if not validate_json(entities):
        raise ValidationError("Invalid extraction")
    summary = llm_call(prompt_summarize, stage1_output=entities)
    report = llm_call(prompt_format, stage2_output=summary)
    return report`,
        testing: `• Test each stage in isolation with unit tests
• Inject malformed JSON at stage 1 to test gate behavior
• Measure end-to-end latency vs single-shot approach
• Test with edge cases: empty input, extremely long input`
    },
    {
        id: 'routing',
        title: 'Routing (Intent Classification → Specialist)',
        tags: ['architecture', 'beginner', 'workflow'],
        difficulty: 'Beginner',
        description: 'A classifier LLM routes incoming requests to the most appropriate downstream handler, model, or prompt. This enables specialization and cost optimization by using smaller models for simple tasks.',
        whenToUse: 'Multi-domain assistants (billing, support, sales), model cascading (cheap model first, expensive if uncertain), A/B testing different prompts.',
        diagram: `graph TD
    A[User Input] --> B[Router LLM<br/>Classify Intent]
    B -->|Billing| C[Billing Agent<br/>GPT-3.5]
    B -->|Technical| D[Tech Support<br/>GPT-4]
    B -->|Sales| E[Sales Agent<br/>Claude Haiku]
    B -->|Unclear| F[Clarification<br/>Prompt]
    C --> G[Unified Response]
    D --> G
    E --> G
    F --> G`,
        prompt: `Classify the user intent into exactly one category. Respond with ONLY the category name.

Categories:
- BILLING: questions about invoices, payments, refunds, subscriptions
- TECHNICAL: bugs, errors, integration help, API questions  
- SALES: pricing, demos, enterprise plans, procurement
- GENERAL: anything else

User message: {{message}}

Category:`,
        code: `def handle_request(message):
    intent = router_llm(classify_prompt, message=message).strip()
    handlers = {
        'BILLING': billing_agent,
        'TECHNICAL': tech_agent_gpt4,
        'SALES': sales_agent_haiku
    }
    handler = handlers.get(intent, general_agent)
    return handler(message)`,
        testing: `• Build a confusion matrix across all intent categories
• Test ambiguous inputs that could fit multiple categories
• Verify fallback behavior for unknown classifications
• Benchmark routing accuracy vs end-to-end latency tradeoff`
    },
    {
        id: 'parallelization',
        title: 'Parallelization (Map-Reduce Pattern)',
        tags: ['architecture', 'advanced', 'workflow'],
        difficulty: 'Advanced',
        description: 'Distribute a task across multiple LLM calls running in parallel, then aggregate the results. The "map" phase processes chunks independently; the "reduce" phase synthesizes outputs.',
        whenToUse: 'Processing large documents, evaluating multiple hypotheses simultaneously, sentiment analysis across sections, parallel candidate generation.',
        diagram: `graph TD
    A[Large Input] --> B[Chunker]
    B --> C1[LLM Call 1<br/>Chunk A]
    B --> C2[LLM Call 2<br/>Chunk B]
    B --> C3[LLM Call 3<br/>Chunk C]
    C1 --> D[Aggregator/Reducer]
    C2 --> D
    C3 --> D
    D --> E[Final Synthesis]`,
        prompt: `// Map Phase (run per chunk)
Analyze the following text chunk for risks and opportunities. List bullet points.
Chunk: {{chunk}}

// Reduce Phase
Synthesize these analyses into a prioritized action plan with owners and deadlines:
{{map_outputs}}`,
        code: `import asyncio

async def parallel_analyze(document):
    chunks = chunk_text(document, size=2000)
    tasks = [llm_async(map_prompt, chunk=c) for c in chunks]
    results = await asyncio.gather(*tasks)
    synthesis = await llm_async(reduce_prompt, map_outputs="\n".join(results))
    return synthesis`,
        testing: `• Verify output consistency when chunk boundaries change
• Test with varying numbers of chunks (1, 5, 20+)
• Check for duplicate findings across overlapping chunks
• Measure speedup vs sequential processing`
    },
    {
        id: 'orchestrator-workers',
        title: 'Orchestrator-Workers (Dynamic Decomposition)',
        tags: ['architecture', 'advanced', 'workflow'],
        difficulty: 'Advanced',
        description: 'A central orchestrator dynamically breaks down tasks and delegates to worker agents. Unlike static parallelization, workers are spawned based on the specific needs of the input.',
        whenToUse: 'Complex coding tasks, multi-file analysis, research with unknown scope, dynamic QA over heterogeneous data sources.',
        diagram: `graph TD
    A[Complex Task] --> B[Orchestrator LLM<br/>Analyze & Plan]
    B -->|Subtask 1| C1[Worker A<br/>Research API]
    B -->|Subtask 2| C2[Worker B<br/>Write Code]
    B -->|Subtask 3| C3[Worker C<br/>Review Security]
    C1 --> D[Synthesizer]
    C2 --> D
    C3 --> D
    D --> E[Final Deliverable]`,
        prompt: `// Orchestrator Prompt
Given this task: {{task}}
1. Break it into subtasks needed for completion
2. For each subtask, specify: description, required_worker_type, dependencies
3. Return as structured JSON

// Worker Prompt (type: code_writer)
You are a senior Python developer. Implement the following subtask:
{{subtask_description}}
Dependencies from other workers: {{dependency_outputs}}
Return only the code with docstrings.`,
        code: `class Orchestrator:
    def execute(self, task):
        plan = self.llm_json(orchestrator_prompt, task=task)
        workers = []
        for subtask in plan.subtasks:
            deps = [w.result for w in workers if w.id in subtask.dependencies]
            worker = WorkerFactory.create(subtask.type)
            workers.append(worker.run(subtask, deps))
        return Synthesizer.combine([w.result for w in workers])`,
        testing: `• Test with cyclic dependency detection
• Verify worker timeout and retry policies
• Inject worker failures to test orchestrator recovery
• Test with tasks requiring 0, 1, and 10+ subtasks`
    },
    {
        id: 'evaluator-optimizer',
        title: 'Evaluator-Optimizer Loop',
        tags: ['architecture', 'testing', 'advanced', 'workflow'],
        difficulty: 'Advanced',
        description: 'One LLM generates a solution while another evaluates it against criteria. If the evaluation fails, feedback is provided and the generator tries again. This creates a self-improving loop.',
        whenToUse: 'High-stakes outputs requiring quality guarantees: code generation, legal document drafting, medical summaries, content moderation, complex reasoning.',
        diagram: `graph TD
    A[Task] --> B[Generator LLM<br/>Draft Solution]
    B --> C[Evaluator LLM<br/>Score & Critique]
    C -->|Score < Threshold| D[Feedback Generator]
    D --> B
    C -->|Score >= Threshold| E[Final Output]
    E --> F[Human Review Queue]`,
        prompt: `// Generator
Generate a Python function based on this specification:
{{spec}}

// Evaluator
Evaluate this solution on:
- Correctness (0-10): Does it handle edge cases?
- Efficiency (0-10): Big-O complexity?
- Readability (0-10): Clean code standards?

Solution: {{generated_code}}

If total score < 25, provide specific feedback for improvement.
If total score >= 25, respond with "PASS".

Format: Score: X/30 | Feedback: [details]`,
        code: `def generate_with_feedback(spec, max_iterations=5):
    draft = generator(spec)
    for i in range(max_iterations):
        eval_result = evaluator(draft, spec=spec)
        if "PASS" in eval_result:
            return draft
        feedback = extract_feedback(eval_result)
        draft = generator(spec, previous_draft=draft, feedback=feedback)
    raise QualityThresholdError("Max iterations reached")`,
        testing: `• Test with intentionally bad specs to verify evaluator catches issues
• Measure convergence rate (avg iterations to PASS)
• Test evaluator bias — swap generator/evaluator models
• Verify no infinite loops with iteration caps`
    },
    {
        id: 'reflection',
        title: 'Reflection / Self-Correction',
        tags: ['prompting', 'advanced', 'architecture'],
        difficulty: 'Advanced',
        description: 'The agent reviews its own output for errors, inconsistencies, or improvements before delivering the final answer. This mimics human proofreading and significantly reduces hallucinations.',
        whenToUse: 'Factual accuracy is critical, mathematical reasoning, code review, long-form content generation, summarization of sensitive data.',
        diagram: `graph TD
    A[Initial Query] --> B[LLM<br/>First Draft]
    B --> C[Reflection LLM<br/>Critique Output]
    C -->|Issues Found| D[Revision LLM<br/>Fix Issues]
    D --> C
    C -->|No Issues| E[Final Polished Output]`,
        prompt: `// First Pass
Answer the following question thoroughly:
{{question}}

// Reflection Pass
Review the answer above for:
1. Factual errors or hallucinations
2. Logical inconsistencies  
3. Missing context or caveats
4. Better ways to explain

List specific issues found. If none, say "No issues found."

// Revision Pass (if issues found)
Given these issues: {{issues}}
Rewrite the answer addressing all points while maintaining completeness.`,
        code: `def self_correcting_answer(question):
    draft = llm(first_pass, question=question)
    for attempt in range(3):
        critique = llm(reflection_pass, answer=draft)
        if "No issues found" in critique:
            return draft
        draft = llm(revision_pass, issues=critique, previous=draft)
    return draft`,
        testing: `• Test with questions known to trigger hallucinations
• Compare accuracy with and without reflection step
• Measure latency cost of additional passes
• Test reflection prompt variations for effectiveness`
    },
    {
        id: 'structured-output',
        title: 'Structured Output / JSON Mode',
        tags: ['prompting', 'beginner', 'tools'],
        difficulty: 'Beginner',
        description: 'Constrain the LLM to output valid, parseable structured data (JSON, XML, Pydantic models). Essential for integrating LLMs into software pipelines and agent tool calls.',
        whenToUse: 'API responses, database records, configuration generation, tool arguments, any scenario where downstream code consumes LLM output programmatically.',
        diagram: `graph LR
    A[User Request] --> B[LLM with JSON Schema]
    B -->|Raw JSON| C[Validator<br/>Pydantic/Zod]
    C -->|Valid| D[Application Code]
    C -->|Invalid| E[Retry with<br/>Error Feedback]
    E --> B`,
        prompt: `Extract information from the text and return valid JSON matching this schema:
{

Please regenerate following the exact schema. Ensure:
- All required fields are present
- Types match (strings quoted, numbers unquoted)
- No trailing commas

Schema: {{json_schema}}

Original task: {{task}}`,
        code: `from tenacity import retry, stop_after_attempt, wait_exponential

class ResilientAgent:
    @retry(stop=stop_after_attempt(3), wait=wait_exponential(multiplier=1, min=4, max=10))
    def llm_call(self, prompt):
        return openai.chat.completions.create(...)

    def safe_generate(self, prompt, schema):
        for attempt in range(3):
            try:
                raw = self.llm_call(prompt)
                parsed = schema.model_validate_json(raw)
                return parsed
            except ValidationError as e:
                prompt += f"\n\nFix error: {e}"
            except RateLimitError:
                time.sleep(2 ** attempt)
        return self.fallback_response()`,
        testing: `• Inject 503 errors to test retry logic
• Test with outputs missing required schema fields
• Verify circuit breaker opens after threshold failures
• Test behavior when all retries exhaust`
    }
];

// ================= STATE =================
let activeTag = 'all';
let searchQuery = '';
let favorites = JSON.parse(localStorage.getItem('agent_patterns_favorites') || '[]');
let showFavoritesOnly = false;

// ================= INIT =================
function init() {
    renderTags();
    renderPatterns();
    updateFavCount();
    initMermaid();

    // Keyboard shortcut
    document.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
            e.preventDefault();
            document.getElementById('search-input').focus();
        }
    });

    // Theme
    if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
        document.getElementById('hljs-theme').href = 'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css';
    } else {
        document.documentElement.classList.remove('dark');
        document.getElementById('hljs-theme').href = 'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css';
    }
}

function initMermaid() {
    mermaid.initialize({
        startOnLoad: false,
        theme: document.documentElement.classList.contains('dark') ? 'dark' : 'default',
        themeVariables: {
            primaryColor: document.documentElement.classList.contains('dark') ? '#1e293b' : '#f1f5f9',
            primaryTextColor: document.documentElement.classList.contains('dark') ? '#e2e8f0' : '#0f172a',
            primaryBorderColor: document.documentElement.classList.contains('dark') ? '#475569' : '#94a3b8',
            lineColor: document.documentElement.classList.contains('dark') ? '#64748b' : '#64748b',
            secondaryColor: document.documentElement.classList.contains('dark') ? '#0f172a' : '#ffffff',
            tertiaryColor: document.documentElement.classList.contains('dark') ? '#334155' : '#f8fafc',
        }
    });
    setTimeout(() => mermaid.run({ querySelector: '.mermaid' }), 100);
}

// ================= THEME =================
function toggleTheme() {
    const isDark = document.documentElement.classList.toggle('dark');
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
    document.getElementById('hljs-theme').href = isDark 
        ? 'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css'
        : 'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css';
    initMermaid();
}

// ================= TAGS =================
function renderTags() {
    const container = document.getElementById('tag-container');
    container.innerHTML = '<span class="text-sm font-medium text-slate-500 dark:text-slate-400 mr-2 py-1">Filter:</span>' +
        allTags.map(tag => `
            <button onclick="setTag('${tag.id}')" 
                class="tag-pill px-3 py-1 rounded-full text-xs font-semibold ${tag.color} ${activeTag === tag.id ? 'ring-2 ring-offset-1 ring-slate-400 dark:ring-slate-600' : 'opacity-70 hover:opacity-100'}">
                ${tag.label}
            </button>
        `).join('');
}

function setTag(tagId) {
    activeTag = tagId;
    renderTags();
    renderPatterns();
}

// ================= SEARCH =================
function performSearch() {
    searchQuery = document.getElementById('search-input').value.toLowerCase();
    renderPatterns();
}

function fuzzyMatch(text, query) {
    if (!query) return true;
    text = text.toLowerCase();
    let ti = 0, qi = 0;
    while (ti < text.length && qi < query.length) {
        if (text[ti] === query[qi]) qi++;
        ti++;
    }
    return qi === query.length;
}

// ================= FAVORITES =================
function toggleFavorite(id) {
    if (favorites.includes(id)) {
        favorites = favorites.filter(f => f !== id);
    } else {
        favorites.push(id);
    }
    localStorage.setItem('agent_patterns_favorites', JSON.stringify(favorites));
    updateFavCount();
    renderPatterns();
}

function updateFavCount() {
    const count = favorites.length;
    const badge = document.getElementById('fav-count');
    badge.textContent = count;
    badge.classList.toggle('hidden', count === 0);
}

function toggleFavoritesView() {
    showFavoritesOnly = !showFavoritesOnly;
    const btn = document.getElementById('btn-favorites');
    btn.classList.toggle('bg-amber-100', showFavoritesOnly);
    btn.classList.toggle('dark:bg-amber-900/30', showFavoritesOnly);
    renderPatterns();
}

// ================= RENDER =================
function renderPatterns() {
    const grid = document.getElementById('patterns-grid');
    const empty = document.getElementById('empty-state');

    let filtered = patterns.filter(p => {
        if (showFavoritesOnly && !favorites.includes(p.id)) return false;
        if (activeTag !== 'all' && !p.tags.includes(activeTag)) return false;
        if (searchQuery) {
            const text = `${p.title} ${p.description} ${p.prompt} ${p.code} ${p.testing} ${p.tags.join(' ')}`.toLowerCase();
            return fuzzyMatch(text, searchQuery);
        }
        return true;
    });

    document.getElementById('showing-count').textContent = filtered.length;

    if (filtered.length === 0) {
        grid.innerHTML = '';
        empty.classList.remove('hidden');
        return;
    }
    empty.classList.add('hidden');

    grid.innerHTML = filtered.map((p, idx) => `
        <article class="card-hover bg-white dark:bg-slate-900 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 overflow-hidden animate-fade-in" style="animation-delay: ${idx * 30}ms">
            <!-- Header -->
            <div class="p-6 cursor-pointer" onclick="toggleCollapse('${p.id}')">
                <div class="flex items-start justify-between gap-4">
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-3 mb-2">
                            <h2 class="text-xl font-bold text-slate-900 dark:text-white">${p.title}</h2>
                            <span class="px-2 py-0.5 rounded-md text-[10px] font-bold uppercase tracking-wider ${p.difficulty === 'Beginner' ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/30 dark:text-emerald-400' : 'bg-amber-100 text-amber-700 dark:bg-amber-900/30 dark:text-amber-400'}">${p.difficulty}</span>
                        </div>
                        <p class="text-slate-600 dark:text-slate-400 text-sm leading-relaxed">${highlightSearch(p.description)}</p>
                        <div class="flex flex-wrap gap-2 mt-3">
                            ${p.tags.map(t => {
                                const tag = allTags.find(x => x.id === t);
                                return `<span class="px-2 py-0.5 rounded-full text-[10px] font-semibold ${tag ? tag.color : 'bg-slate-100 text-slate-600'}">${tag ? tag.label : t}</span>`;
                            }).join('')}
                        </div>
                    </div>
                    <div class="flex items-center gap-2 shrink-0">
                        <button onclick="event.stopPropagation(); toggleFavorite('${p.id}')" class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors" title="Toggle Favorite">
                            <svg class="w-5 h-5 ${favorites.includes(p.id) ? 'favorite-active' : 'text-slate-400'}" fill="${favorites.includes(p.id) ? 'currentColor' : 'none'}" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/>
                            </svg>
                        </button>
                        <svg id="chevron-${p.id}" class="chevron w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                        </svg>
                    </div>
                </div>
            </div>

            <!-- Collapsible Content -->
            <div id="content-${p.id}" class="collapsible-content">
                <div class="px-6 pb-6 space-y-6 border-t border-slate-100 dark:border-slate-800 pt-6">

                    <!-- When to Use -->
                    <div class="bg-slate-50 dark:bg-slate-800/50 rounded-xl p-4 border border-slate-100 dark:border-slate-800">
                        <h3 class="text-sm font-semibold text-slate-900 dark:text-white mb-2 flex items-center gap-2">
                            <svg class="w-4 h-4 text-primary-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                            When to Use
                        </h3>
                        <p class="text-sm text-slate-600 dark:text-slate-400">${highlightSearch(p.whenToUse)}</p>
                    </div>

                    <!-- Diagram -->
                    <div>
                        <h3 class="text-sm font-semibold text-slate-900 dark:text-white mb-3 flex items-center gap-2">
                            <svg class="w-4 h-4 text-accent-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 5a1 1 0 011-1h14a1 1 0 011 1v2a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM4 13a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H5a1 1 0 01-1-1v-6zM16 13a1 1 0 011-1h2a1 1 0 011 1v6a1 1 0 01-1 1h-2a1 1 0 01-1-1v-6z"/></svg>
                            Architecture Diagram
                        </h3>
                        <div class="bg-slate-50 dark:bg-slate-850 rounded-xl p-4 border border-slate-200 dark:border-slate-700 overflow-x-auto">
                            <div class="mermaid">${p.diagram}</div>
                        </div>
                    </div>

                    <!-- Prompt Template -->
                    <div class="group relative">
                        <div class="flex items-center justify-between mb-2">
                            <h3 class="text-sm font-semibold text-slate-900 dark:text-white flex items-center gap-2">
                                <svg class="w-4 h-4 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/></svg>
                                Prompt Template
                            </h3>
                            <button onclick="copyToClipboard(this, \`${escapeHtml(p.prompt)}\`)" class="copy-btn flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-xs font-medium text-slate-600 dark:text-slate-400 transition-colors">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                                Copy
                            </button>
                        </div>
                        <pre class="rounded-xl bg-slate-900 text-slate-100 p-4 text-xs overflow-x-auto leading-relaxed"><code class="language-text">${escapeHtml(p.prompt)}</code></pre>
                    </div>

                    <!-- Code Example -->
                    <div class="group relative">
                        <div class="flex items-center justify-between mb-2">
                            <h3 class="text-sm font-semibold text-slate-900 dark:text-white flex items-center gap-2">
                                <svg class="w-4 h-4 text-primary-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/></svg>
                                Implementation
                            </h3>
                            <button onclick="copyToClipboard(this, \`${escapeHtml(p.code)}\`)" class="copy-btn flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-xs font-medium text-slate-600 dark:text-slate-400 transition-colors">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                                Copy
                            </button>
                        </div>
                        <pre class="rounded-xl bg-slate-900 text-slate-100 p-4 text-xs overflow-x-auto leading-relaxed"><code class="language-python">${escapeHtml(p.code)}</code></pre>
                    </div>

                    <!-- Testing Strategy -->
                    <div class="group relative">
                        <div class="flex items-center justify-between mb-2">
                            <h3 class="text-sm font-semibold text-slate-900 dark:text-white flex items-center gap-2">
                                <svg class="w-4 h-4 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                                Testing Strategy
                            </h3>
                            <button onclick="copyToClipboard(this, \`${escapeHtml(p.testing)}\`)" class="copy-btn flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-xs font-medium text-slate-600 dark:text-slate-400 transition-colors">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                                Copy
                            </button>
                        </div>
                        <pre class="rounded-xl bg-slate-50 dark:bg-slate-850 border border-slate-200 dark:border-slate-800 p-4 text-xs overflow-x-auto leading-relaxed whitespace-pre-wrap text-slate-700 dark:text-slate-300"><code class="language-text">${escapeHtml(p.testing)}</code></pre>
                    </div>

                </div>
            </div>
        </article>
    `).join('');

    // Re-init syntax highlighting and mermaid
    document.querySelectorAll('pre code').forEach(block => hljs.highlightElement(block));
    setTimeout(() => mermaid.run({ querySelector: '.mermaid' }), 50);
}

// ================= HELPERS =================
function toggleCollapse(id) {
    const content = document.getElementById(`content-${id}`);
    const chevron = document.getElementById(`chevron-${id}`);
    content.classList.toggle('open');
    chevron.classList.toggle('open');
}

function expandAll() {
    document.querySelectorAll('.collapsible-content').forEach(el => el.classList.add('open'));
    document.querySelectorAll('.chevron').forEach(el => el.classList.add('open'));
}

function collapseAll() {
    document.querySelectorAll('.collapsible-content').forEach(el => el.classList.remove('open'));
    document.querySelectorAll('.chevron').forEach(el => el.classList.remove('open'));
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function highlightSearch(text) {
    if (!searchQuery) return text;
    const regex = new RegExp(`(${searchQuery.split('').join('.*?')})`, 'gi');
    return text.replace(regex, '<mark class="search-highlight">$1</mark>');
}

function copyToClipboard(btn, text) {
    navigator.clipboard.writeText(text).then(() => {
        const original = btn.innerHTML;
        btn.innerHTML = '<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg> Copied!';
        btn.classList.add('text-green-600', 'dark:text-green-400');
        showToast('Copied to clipboard!');
        setTimeout(() => {
            btn.innerHTML = original;
            btn.classList.remove('text-green-600', 'dark:text-green-400');
        }, 2000);
    });
}

function showToast(msg) {
    const toast = document.getElementById('toast');
    document.getElementById('toast-msg').textContent = msg;
    toast.classList.remove('translate-y-20', 'opacity-0');
    setTimeout(() => toast.classList.add('translate-y-20', 'opacity-0'), 2500);
}

// Start
init();
</script>
</body>
