<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DevRef — Developer Cheat Sheet Library</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* ── TOKENS ─────────────────────────────────────────────────────────── */
:root {
  --accent: #f0883e;
  --accent2: #58a6ff;
  --bg:       #0d1117;
  --bg2:      #161b22;
  --bg3:      #21262d;
  --bg4:      #30363d;
  --border:   #30363d;
  --text:     #e6edf3;
  --text2:    #8b949e;
  --text3:    #6e7681;
  --code-bg:  #161b22;
  --tag-bg:   #1f2937;
  --fav:      #f0883e;
  --green:    #3fb950;
  --red:      #f85149;
  --purple:   #bc8cff;
  --cyan:     #39d353;
  --yellow:   #e3b341;
  --sidebar-w: 220px;
  --transition: 0.18s cubic-bezier(.4,0,.2,1);
}
[data-theme="light"] {
  --bg:       #ffffff;
  --bg2:      #f6f8fa;
  --bg3:      #eaeef2;
  --bg4:      #d0d7de;
  --border:   #d0d7de;
  --text:     #1f2328;
  --text2:    #636c76;
  --text3:    #9198a1;
  --code-bg:  #f6f8fa;
  --tag-bg:   #e8f0fe;
}

/* ── RESET ───────────────────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'JetBrains Mono',monospace;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;transition:background var(--transition),color var(--transition)}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--accent)}
::selection{background:rgba(240,136,62,.25)}

/* ── LAYOUT ──────────────────────────────────────────────────────────── */
.shell{display:flex;height:100vh;overflow:hidden}

/* SIDEBAR */
.sidebar{
  width:var(--sidebar-w);flex-shrink:0;background:var(--bg2);border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;transition:width var(--transition),background var(--transition);z-index:50;
}
.sidebar.collapsed{width:52px}
.sidebar-header{padding:14px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0}
.logo{font-family:'Syne',sans-serif;font-weight:800;font-size:18px;color:var(--accent);white-space:nowrap;overflow:hidden;letter-spacing:-0.5px}
.logo span{color:var(--text2)}
.sidebar.collapsed .logo,.sidebar.collapsed .sidebar-search,.sidebar.collapsed .cat-label{display:none}
.sidebar-search{padding:10px 12px;flex-shrink:0}
.sidebar-search input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:6px 10px;color:var(--text);font-family:inherit;font-size:11px;outline:none;transition:border-color var(--transition)}
.sidebar-search input:focus{border-color:var(--accent)}
.sidebar-nav{flex:1;overflow-y:auto;padding:8px 0}
.cat-label{font-size:9px;font-weight:700;letter-spacing:1.5px;color:var(--text3);text-transform:uppercase;padding:12px 14px 4px;pointer-events:none}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:8px 14px;cursor:pointer;
  font-size:11.5px;color:var(--text2);transition:all var(--transition);white-space:nowrap;overflow:hidden;border-left:2px solid transparent;
}
.nav-item:hover{background:var(--bg3);color:var(--text)}
.nav-item.active{background:var(--bg3);color:var(--accent);border-left-color:var(--accent)}
.nav-item .icon{font-size:15px;flex-shrink:0;width:20px;text-align:center}
.nav-item .badge{margin-left:auto;background:var(--bg4);border-radius:10px;padding:1px 6px;font-size:9px;color:var(--text3);flex-shrink:0}
.sidebar.collapsed .nav-item{padding:10px;justify-content:center}
.sidebar.collapsed .nav-item .badge{display:none}

/* MAIN */
.main{flex:1;overflow-y:auto;display:flex;flex-direction:column;min-width:0}

/* TOPBAR */
.topbar{
  position:sticky;top:0;z-index:40;background:var(--bg);border-bottom:1px solid var(--border);
  padding:12px 20px;display:flex;align-items:center;gap:12px;flex-shrink:0;
  backdrop-filter:blur(10px);background:rgba(13,17,23,.9);
  transition:background var(--transition);
}
[data-theme="light"] .topbar{background:rgba(255,255,255,.92)}
.toggle-sidebar{background:none;border:1px solid var(--border);border-radius:6px;padding:5px 8px;cursor:pointer;color:var(--text2);font-size:13px;transition:all var(--transition)}
.toggle-sidebar:hover{border-color:var(--accent);color:var(--accent)}
.search-wrap{flex:1;position:relative;max-width:560px}
.search-wrap input{
  width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:8px;
  padding:9px 14px 9px 36px;color:var(--text);font-family:inherit;font-size:13px;outline:none;
  transition:border-color var(--transition),box-shadow var(--transition)
}
.search-wrap input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(240,136,62,.12)}
.search-wrap .s-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:14px;pointer-events:none}
.search-wrap .clear-btn{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text3);cursor:pointer;font-size:14px;display:none}
.search-wrap input:not(:placeholder-shown)+.clear-btn{display:block}
.topbar-actions{display:flex;align-items:center;gap:8px;margin-left:auto}
.icon-btn{background:none;border:1px solid var(--border);border-radius:6px;padding:6px 10px;cursor:pointer;color:var(--text2);font-size:13px;transition:all var(--transition);display:flex;align-items:center;gap:5px;font-family:inherit;font-size:11px;white-space:nowrap}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
.icon-btn.active{border-color:var(--fav);color:var(--fav);background:rgba(240,136,62,.08)}
.theme-btn{min-width:32px}

/* FILTER BAR */
.filter-bar{padding:10px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--bg);transition:background var(--transition)}
.filter-chip{
  padding:4px 11px;border-radius:20px;font-size:10.5px;border:1px solid var(--border);
  cursor:pointer;color:var(--text2);transition:all var(--transition);background:none;font-family:inherit;
}
.filter-chip:hover{border-color:var(--accent);color:var(--accent)}
.filter-chip.on{background:var(--accent);border-color:var(--accent);color:#000;font-weight:600}
.filter-label{font-size:10px;color:var(--text3);margin-right:4px;white-space:nowrap}

/* CONTENT */
.content{padding:20px;flex:1}
.section-header{
  display:flex;align-items:center;gap:12px;margin-bottom:18px;padding-bottom:12px;
  border-bottom:1px solid var(--border);
}
.section-icon{font-size:22px}
.section-title{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;color:var(--text)}
.section-desc{font-size:11px;color:var(--text2);margin-top:2px}
.section-count{margin-left:auto;font-size:10px;color:var(--text3);background:var(--bg3);padding:3px 9px;border-radius:10px}

.section-block{margin-bottom:40px}
.section-block.hidden{display:none}

/* CARDS GRID */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;margin-top:14px}
.card{
  background:var(--bg2);border:1px solid var(--border);border-radius:10px;overflow:hidden;
  transition:border-color var(--transition),transform var(--transition),box-shadow var(--transition);
  position:relative;
}
.card:hover{border-color:var(--bg4);box-shadow:0 4px 20px rgba(0,0,0,.3);transform:translateY(-1px)}
[data-theme="light"] .card:hover{box-shadow:0 4px 20px rgba(0,0,0,.1)}
.card-head{
  padding:11px 14px;display:flex;align-items:center;gap:8px;
  border-bottom:1px solid var(--border);background:var(--bg3);
}
.card-title{font-size:12px;font-weight:600;color:var(--text);flex:1}
.card-tags{display:flex;gap:4px;flex-wrap:wrap}
.tag{font-size:9px;padding:2px 7px;border-radius:10px;background:var(--tag-bg);color:var(--text3);border:1px solid var(--border)}
.fav-btn{background:none;border:none;cursor:pointer;font-size:14px;color:var(--text3);transition:all var(--transition);padding:2px;flex-shrink:0;line-height:1}
.fav-btn:hover,.fav-btn.active{color:var(--fav);transform:scale(1.2)}
.card-body{padding:12px 14px}
.card-desc{font-size:11px;color:var(--text2);margin-bottom:10px;line-height:1.6}

/* CODE BLOCK */
.code-block{
  background:var(--code-bg);border:1px solid var(--border);border-radius:6px;
  overflow:hidden;margin:5px 0;
}
.code-block-head{
  padding:5px 12px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--border);background:var(--bg3);
}
.code-label{font-size:9px;color:var(--text3);font-weight:600;letter-spacing:.5px;text-transform:uppercase}
.copy-btn{
  background:none;border:1px solid var(--border);border-radius:4px;padding:2px 8px;
  font-size:9px;color:var(--text3);cursor:pointer;font-family:inherit;transition:all var(--transition)
}
.copy-btn:hover{border-color:var(--accent2);color:var(--accent2)}
.copy-btn.copied{border-color:var(--green);color:var(--green)}
.code-block pre{padding:10px 12px;overflow-x:auto;font-size:11.5px;line-height:1.65;color:var(--text)}
.code-block code .kw{color:var(--purple)}
.code-block code .fn{color:var(--accent2)}
.code-block code .str{color:var(--green)}
.code-block code .cm{color:var(--text3)}
.code-block code .num{color:var(--yellow)}
.code-block code .op{color:var(--accent)}
.code-block code .flag{color:var(--cyan)}

/* CMD ROW — compact single-line */
.cmd-row{
  display:flex;align-items:center;gap:8px;padding:6px 10px;
  border-radius:6px;background:var(--code-bg);border:1px solid var(--border);margin:4px 0;
  transition:border-color var(--transition);cursor:default;
}
.cmd-row:hover{border-color:var(--bg4)}
.cmd-row code{flex:1;font-size:11.5px;color:var(--accent2);font-family:'JetBrains Mono',monospace}
.cmd-row .cmd-desc{font-size:10px;color:var(--text3);flex:1;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmd-row .copy-btn{flex-shrink:0}

/* TABLE */
.ref-table{width:100%;border-collapse:collapse;font-size:11px;margin:6px 0}
.ref-table th{text-align:left;padding:6px 10px;background:var(--bg3);color:var(--text2);font-weight:600;font-size:10px;letter-spacing:.5px;border-bottom:1px solid var(--border)}
.ref-table td{padding:7px 10px;border-bottom:1px solid var(--border);color:var(--text);vertical-align:top}
.ref-table td:first-child{color:var(--accent2);white-space:nowrap;font-weight:500}
.ref-table tr:last-child td{border-bottom:none}
.ref-table tr:hover td{background:var(--bg3)}

/* EMPTY STATE */
.empty{text-align:center;padding:60px 20px;color:var(--text3)}
.empty .e-icon{font-size:40px;margin-bottom:12px}
.empty h3{font-family:'Syne',sans-serif;color:var(--text2);margin-bottom:6px}
.empty p{font-size:12px}

/* TOAST */
.toast{
  position:fixed;bottom:20px;right:20px;background:var(--bg3);border:1px solid var(--border);
  border-radius:8px;padding:10px 16px;font-size:12px;color:var(--text);z-index:9999;
  opacity:0;transform:translateY(10px);transition:all .25s;pointer-events:none;
  display:flex;align-items:center;gap:8px;
}
.toast.show{opacity:1;transform:translateY(0)}
.toast .t-dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex-shrink:0}

/* STATS BAR */
.stats-bar{
  padding:8px 20px;border-bottom:1px solid var(--border);
  font-size:10px;color:var(--text3);display:flex;gap:16px;align-items:center;background:var(--bg);
}
.stat{display:flex;align-items:center;gap:5px}
.stat-val{color:var(--text2);font-weight:600}

/* BACK TO TOP */
.back-top{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:var(--bg3);border:1px solid var(--border);border-radius:20px;
  padding:6px 16px;font-size:11px;color:var(--text2);cursor:pointer;
  transition:all var(--transition);display:none;z-index:100;font-family:inherit;
}
.back-top:hover{border-color:var(--accent);color:var(--accent)}

/* KEYBOARD HINT */
.kb-hint{display:inline-flex;align-items:center;gap:4px;font-size:10px;color:var(--text3)}
kbd{background:var(--bg3);border:1px solid var(--border);border-radius:3px;padding:1px 5px;font-size:10px;font-family:inherit;color:var(--text2)}

/* HIGHLIGHT */
.hl{background:rgba(240,136,62,.3);color:var(--text);border-radius:2px;padding:0 2px}

/* SECTION NAV PILL */
.s-pill{
  display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;
  background:var(--bg3);border:1px solid var(--border);font-size:11px;color:var(--text2);
  cursor:pointer;transition:all var(--transition);
}
.s-pill:hover{border-color:var(--accent);color:var(--accent)}

/* PROGRESS INDICATOR */
.progress{height:2px;background:var(--bg4);position:fixed;top:0;left:0;right:0;z-index:200}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0%;transition:width .1s}

@media(max-width:768px){
  .sidebar{position:absolute;height:100vh;box-shadow:2px 0 20px rgba(0,0,0,.5)}
  .sidebar:not(.collapsed){z-index:200}
  .cards{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="progress"><div class="progress-bar" id="progress"></div></div>

<div class="shell">

<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="logo">Dev<span>Ref</span></div>

  <div class="sidebar-search">

  </div>

    <div class="nav-item" data-section="cpp" onclick="filterSection('cpp',this)"><span class="icon">⚙️</span>C++<span class="badge" id="badge-cpp"></span></div>

  </nav>
</aside>

<div class="main" id="mainArea">
  <div class="topbar">
    <button class="toggle-sidebar" onclick="toggleSidebar()" title="Toggle sidebar (Ctrl+B)">☰</button>
    <div class="search-wrap">
      <span class="s-icon">🔍</span>
      <input type="text" id="globalSearch" placeholder="Search commands, functions, keywords… (Ctrl+K)" oninput="onSearch(this.value)">

  <div class="filter-bar" id="filterBar">
    <span class="filter-label">TAGS:</span>
    <button class="filter-chip on" data-tag="all" onclick="filterTag('all',this)">All</button>

    <button class="filter-chip" data-tag="advanced" onclick="filterTag('advanced',this)">Advanced</button>
    <button class="filter-chip" data-tag="stl" onclick="filterTag('stl',this)">STL</button>
    <button class="filter-chip" data-tag="async" onclick="filterTag('async',this)">Async</button>
    <button class="filter-chip" data-tag="network" onclick="filterTag('network',this)">Network</button>
    <button class="filter-chip" data-tag="files" onclick="filterTag('files',this)">Files</button>

  </div>

  <div class="content" id="content"></div>
</div>

<script>
// ── DATA ─────────────────────────────────────────────────────────────────
const DATA = {

git: {
  icon: '🌿', title: 'Git', desc: 'Version control commands & workflows',
  cards: [
    {id:'git-setup', title:'Initial Setup', tags:['basic'], desc:'One-time global configuration',
     content:[{type:'cmds', rows:[
      ['git config --global user.name "Your Name"','Set global username'],
      ['git config --global user.email "you@mail.com"','Set global email'],
      ['git config --global core.editor "code --wait"','Set VS Code as editor'],
      ['git config --list','List all config'],
      ['git config --global alias.lg "log --oneline --graph --decorate"','Create alias'],
    ]}]},
    {id:'git-basics', title:'Core Workflow', tags:['basic'], desc:'Everyday git operations',
     content:[{type:'cmds', rows:[
      ['git init','Initialize repo in current dir'],
      ['git clone <url>','Clone remote repo'],
      ['git clone <url> --depth 1','Shallow clone (faster)'],
      ['git status','Show working tree status'],
      ['git add .','Stage all changes'],
      ['git add -p','Stage interactively (hunk by hunk)'],
      ['git commit -m "msg"','Commit staged changes'],
      ['git commit --amend --no-edit','Amend last commit (keep msg)'],
      ['git push origin <branch>','Push branch to remote'],
      ['git pull --rebase','Pull and rebase local commits'],
      ['git fetch --prune','Fetch + remove stale remote refs'],
    ]}]},
    {id:'git-branch', title:'Branching & Merging', tags:['basic'], desc:'Branch management',
     content:[{type:'cmds', rows:[
      ['git branch','List local branches'],
      ['git branch -a','List all branches (incl remote)'],
      ['git branch <name>','Create new branch'],
      ['git checkout -b <name>','Create & switch to branch'],
      ['git switch <name>','Switch branch (modern)'],
      ['git switch -c <name>','Create & switch (modern)'],
      ['git merge <branch>','Merge branch into current'],
      ['git merge --no-ff <branch>','Merge with merge commit'],
      ['git merge --squash <branch>','Squash-merge (one commit)'],
      ['git rebase <branch>','Rebase current onto branch'],
      ['git rebase -i HEAD~3','Interactive rebase last 3 commits'],
      ['git branch -d <name>','Delete merged branch'],
      ['git branch -D <name>','Force delete branch'],
      ['git push origin --delete <name>','Delete remote branch'],
    ]}]},
    {id:'git-log', title:'Log & History', tags:['basic'], desc:'Inspect commit history',
     content:[{type:'cmds', rows:[
      ['git log --oneline','Compact one-line log'],
      ['git log --oneline --graph --all','Visual branch graph'],
      ['git log -p <file>','Patch history for file'],
      ['git log --author="name"','Filter by author'],
      ['git log --since="2 weeks ago"','Filter by date'],
      ['git diff','Unstaged changes'],
      ['git diff --staged','Staged changes vs last commit'],
      ['git diff <branch1>..<branch2>','Diff between branches'],
      ['git show <hash>','Show commit details'],
      ['git blame <file>','Who changed each line'],
      ['git log -S "searchterm"','Find commits touching string'],
    ]}]},
    {id:'git-stash', title:'Stash', tags:['basic'], desc:'Temporarily shelve changes',
     content:[{type:'cmds', rows:[
      ['git stash','Stash working changes'],

# Timer decorator
def timer(fn):
    @functools.wraps(fn)
    def wrapper(*args, **kwargs):
        start = time.perf_counter()
        result = fn(*args, **kwargs)
        print(f"{fn.__name__}: {time.perf_counter()-start:.4f}s")
        return result
    return wrapper

# Retry decorator
def retry(max_attempts=3, exceptions=(Exception,)):
    def decorator(fn):
        @functools.wraps(fn)
        def wrapper(*args, **kwargs):
            for attempt in range(max_attempts):
                try: return fn(*args, **kwargs)
                except exceptions as e:
                    if attempt == max_attempts-1: raise
                    time.sleep(2 ** attempt)  # exponential backoff
        return wrapper
    return decorator

@retry(max_attempts=3, exceptions=(ConnectionError,))

// ── STATE ─────────────────────────────────────────────────────────────────────
let activeSection = 'all';
let activeTag = 'all';
let searchQuery = '';
let favMode = false;
let favorites = JSON.parse(localStorage.getItem('devref_favs') || '[]');
let sidebarCollapsed = false;

// ── RENDER ────────────────────────────────────────────────────────────────────
function render() {
  const container = document.getElementById('content');
  container.innerHTML = '';
  let totalRendered = 0;

  Object.entries(DATA).forEach(([sectionKey, section]) => {
    const shouldShowSection = activeSection === 'all' || activeSection === sectionKey
                           || (activeSection === 'fav');

    const matchingCards = section.cards.filter(card => {
      if (activeSection === 'fav' && !favorites.includes(card.id)) return false;
      if (activeTag !== 'all' && !card.tags.includes(activeTag)) return false;
      if (searchQuery) {
        const q = searchQuery.toLowerCase();
        const inTitle = card.title.toLowerCase().includes(q);
        const inDesc = card.desc.toLowerCase().includes(q);
        const inContent = JSON.stringify(card.content).toLowerCase().includes(q);
        if (!inTitle && !inDesc && !inContent) return false;
      }
      return true;
    });

    if (!shouldShowSection || matchingCards.length === 0) return;
    totalRendered += matchingCards.length;

    const block = document.createElement('div');
    block.className = 'section-block';
    block.id = 'section-' + sectionKey;
    block.innerHTML = `
      <div class="section-header">
        <span class="section-icon">${section.icon}</span>
        <div>
          <div class="section-title">${section.title}</div>
          <div class="section-desc">${section.desc}</div>
        </div>
        <span class="section-count">${matchingCards.length} card${matchingCards.length!==1?'s':''}</span>
      </div>
      <div class="cards">${matchingCards.map(renderCard).join('')}</div>
    `;
    container.appendChild(block);
  });

  if (totalRendered === 0) {
    container.innerHTML = `<div class="empty">
      <div class="e-icon">🔭</div>
      <h3>Nothing found</h3>
      <p>Try a different search term or clear your filters.</p>
    </div>`;
  }

  document.getElementById('statTotal').textContent = totalRendered;
  document.getElementById('statSearch').textContent = searchQuery ? `"${searchQuery}" – ${totalRendered} results` : '–';
  updateBadges();
}

function renderCard(card) {
  const isFav = favorites.includes(card.id);
  const content = card.content.map(renderContent).join('');
  const tags = card.tags.map(t => `<span class="tag">${t}</span>`).join('');
  return `
    <div class="card" id="card-${card.id}" data-tags="${card.tags.join(' ')}">
      <div class="card-head">
        <span class="card-title">${highlightSearch(card.title)}</span>
        <div class="card-tags">${tags}</div>
        <button class="fav-btn ${isFav?'active':''}" onclick="toggleFav('${card.id}',this)" title="Favorite">★</button>
      </div>
      <div class="card-body">
        <div class="card-desc">${highlightSearch(card.desc)}</div>
        ${content}
      </div>
    </div>`;
}

function renderContent(c) {
  if (c.type === 'cmds') {
    return c.rows.map(([cmd, desc]) => `
      <div class="cmd-row">
        <code>${highlightSearch(escapeHtml(cmd))}</code>
        <span class="cmd-desc">${highlightSearch(escapeHtml(desc||''))}</span>
        <button class="copy-btn" onclick="copyText(this,'${escapeAttr(cmd)}')">copy</button>
      </div>`).join('');
  }
  if (c.type === 'code') {
    const hl = highlightCode(c.code, c.label);
    return `<div class="code-block">
      <div class="code-block-head">
        <span class="code-label">${c.label||'code'}</span>
        <button class="copy-btn" onclick="copyText(this,\`${escapeAttr(c.code)}\`)">copy all</button>
      </div>
      <pre><code>${hl}</code></pre>
    </div>`;
  }
  if (c.type === 'table') {
    const headers = c.cols.map(col => `<th>${col}</th>`).join('');
    const rows = c.rows.map(row =>
      `<tr>${row.map((cell,i) => `<td>${i===0?`<code>${escapeHtml(cell)}</code>`:escapeHtml(cell)}</td>`).join('')}</tr>`
    ).join('');
    return `<div style="overflow-x:auto"><table class="ref-table"><thead><tr>${headers}</tr></thead><tbody>${rows}</tbody></table></div>`;
  }
  return '';
}

function highlightCode(code, lang) {
  let c = escapeHtml(code);
  if (['python','javascript','typescript','c++'].includes(lang)) {
    // keywords
    const kws = lang==='python'
      ? 'def|class|import|from|return|if|elif|else|for|while|with|as|try|except|finally|raise|pass|yield|async|await|True|False|None|and|or|not|in|is|lambda|global|nonlocal'
      : lang==='c++'
      ? 'auto|const|int|float|double|bool|void|char|struct|class|template|typename|namespace|using|return|if|else|for|while|do|switch|case|break|continue|new|delete|nullptr|true|false|public|private|protected|virtual|override|static|constexpr|inline|explicit|noexcept'
      : 'const|let|var|function|return|if|else|for|while|do|switch|case|break|continue|new|delete|typeof|instanceof|this|class|extends|import|export|default|from|async|await|try|catch|finally|throw|yield|true|false|null|undefined|interface|type|enum|implements|abstract|readonly|void|never|any|unknown|as|of|in';
    c = c.replace(new RegExp(`\\b(${kws})\\b`, 'g'), '<span class="kw">$1</span>');
    // strings
    c = c.replace(/(&quot;.*?&quot;|&#039;.*?&#039;|`.*?`)/g, '<span class="str">$1</span>');
    // comments
    c = c.replace(/(#.*$|\/\/.*$|\/\*[\s\S]*?\*\/)/gm, '<span class="cm">$1</span>');
    // numbers
    c = c.replace(/\b(\d+\.?\d*)\b/g, '<span class="num">$1</span>');
  }
  if (['bash','batch'].includes(lang)) {
    c = c.replace(/(#.*$|REM\s.*$)/gim, '<span class="cm">$1</span>');
    c = c.replace(/(&quot;[^&]*&quot;)/g, '<span class="str">$1</span>');
    c = c.replace(/(-{1,2}[\w-]+)/g, '<span class="flag">$1</span>');
  }
  return c;
}

// ── INTERACTIONS ──────────────────────────────────────────────────────────────
function toggleFav(id, btn) {
  if (favorites.includes(id)) {
    favorites = favorites.filter(f => f !== id);
    btn.classList.remove('active');
  } else {
    favorites.push(id);
    btn.classList.add('active');
  }
  localStorage.setItem('devref_favs', JSON.stringify(favorites));
  document.getElementById('statFavs').textContent = favorites.length;
  document.getElementById('badge-fav').textContent = favorites.length || '';
  if (activeSection === 'fav') render();
}

function filterSection(key, el) {
  activeSection = key;
  favMode = key === 'fav';
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  el.classList.add('active');
  render();
  document.getElementById('mainArea').scrollTo({top:0, behavior:'smooth'});
}

function filterTag(tag, btn) {
  activeTag = tag;
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('on'));
  btn.classList.add('on');
  render();
}

function onSearch(q) {
  searchQuery = q;
  render();
}

function clearSearch() {
  document.getElementById('globalSearch').value = '';
  searchQuery = '';
  render();
}

function toggleFavMode() {
  const btn = document.getElementById('favToggleBtn');
  if (activeSection === 'fav') {
    filterSection('all', document.querySelector('[data-section="all"]'));
    btn.classList.remove('active');
  } else {
    filterSection('fav', document.querySelector('[data-section="fav"]'));
    btn.classList.add('active');
  }
}

function toggleSidebar() {
  sidebarCollapsed = !sidebarCollapsed;
  document.getElementById('sidebar').classList.toggle('collapsed', sidebarCollapsed);
}

function toggleTheme() {
  const html = document.documentElement;
  const isDark = html.dataset.theme === 'dark';
  html.dataset.theme = isDark ? 'light' : 'dark';
  document.getElementById('themeBtn').textContent = isDark ? '🌙' : '☀️';
  localStorage.setItem('devref_theme', html.dataset.theme);
}

// ── UTILS ─────────────────────────────────────────────────────────────────────
function copyText(btn, text) {
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✓ copied';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = btn.textContent.includes('all') ? 'copy all' : 'copy'; btn.classList.remove('copied'); }, 1800);
    showToast('Copied to clipboard!');
  });
}

function showToast(msg) {
  const t = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

function highlightSearch(text) {
  if (!searchQuery || !text) return text;
  const re = new RegExp(`(${escapeRegex(searchQuery)})`, 'gi');
  return text.replace(re, '<span class="hl">$1</span>');
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}
function escapeAttr(s) {
  return s.replace(/\\/g,'\\\\').replace(/`/g,'\\`').replace(/\$/g,'\\$');
}
function escapeRegex(s) {
  return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
}

function updateBadges() {
  let total = 0;
  Object.entries(DATA).forEach(([key, sec]) => {
    const count = sec.cards.length;
    total += count;
    const el = document.getElementById('badge-' + key);
    if (el) el.textContent = count;
  });
  document.getElementById('badge-all').textContent = total;
  document.getElementById('badge-fav').textContent = favorites.length || '';
  document.getElementById('statFavs').textContent = favorites.length;
}

// Sidebar category filter
document.getElementById('sideSearch').addEventListener('input', e => {
  const q = e.target.value.toLowerCase();
  document.querySelectorAll('.nav-item[data-section]').forEach(item => {
    const sec = item.dataset.section;
    const d = DATA[sec];
    const match = !q || (d && d.title.toLowerCase().includes(q)) || sec.includes(q);
    item.style.display = match ? '' : 'none';
  });
});

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (e.ctrlKey && e.key === 'k') { e.preventDefault(); document.getElementById('globalSearch').focus(); }
  if (e.ctrlKey && e.key === 'b') toggleSidebar();
  if (e.ctrlKey && e.key === 't') toggleTheme();
  if (e.key === 'Escape') { clearSearch(); document.getElementById('globalSearch').blur(); }
});

// Scroll progress & back to top
document.getElementById('mainArea').addEventListener('scroll', () => {
  const el = document.getElementById('mainArea');
  const pct = el.scrollTop / (el.scrollHeight - el.clientHeight) * 100;
  document.getElementById('progress').style.width = pct + '%';
  document.getElementById('backTop').style.display = el.scrollTop > 400 ? 'block' : 'none';
});

// Init
(function init() {
  const saved = localStorage.getItem('devref_theme');
  if (saved) {
    document.documentElement.dataset.theme = saved;
    document.getElementById('themeBtn').textContent = saved === 'dark' ? '🌙' : '☀️';
  }
  render();
})();
</script>
