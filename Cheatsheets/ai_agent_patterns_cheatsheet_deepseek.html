            -webkit-text-fill-color: transparent;
            background-clip: text;

            min-width: 200px;

            left: 0.75rem;
            top: 50%;
            transform: translateY(-50%);

            pointer-events: none;

        .toolbar-buttons {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .btn {
            padding: 0.5rem 1rem;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--bg-card);
            color: var(--text);
            cursor: pointer;
            font-size: 0.9rem;
            transition: all var(--transition);
            display: flex;
            align-items: center;
            gap: 0.3rem;

            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            border-bottom: 1px solid var(--border);
            background: var(--bg-card);

            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            background: var(--tag-bg);
            color: var(--tag-text);
            border: 1px solid transparent;
            transition: all var(--transition);
            white-space: nowrap;

        .tag-chip:hover { border-color: var(--primary); }
        .tag-chip.active { background: var(--primary); color: white; }

            border-radius: var(--radius);
            padding: 1.25rem;
            box-shadow: var(--shadow);

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 0.5rem;
            cursor: pointer;
        }
        .card-title {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--primary);

            gap: 0.3rem;

        .card-tag {

            padding: 0.15rem 0.5rem;
            border-radius: 12px;
            background: var(--tag-bg);
            color: var(--tag-text);
        }
        .card-body {
            margin-top: 0.75rem;
            border-top: 1px solid var(--border);
            padding-top: 0.75rem;
        }
        .card-actions {
            display: flex;
            gap: 0.4rem;
            position: absolute;
            top: 0.75rem;
            right: 0.75rem;
        }
        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
            color: var(--text-secondary);
            padding: 0.2rem;
            border-radius: 4px;
            transition: all var(--transition);

        .icon-btn:hover { color: var(--primary); }
        .icon-btn.favorited { color: var(--favorite-color); }
        .copy-btn.copied { color: var(--success); }

        /* Diagram container */
        .diagram {
            margin: 0.75rem 0;
            background: white;
            border-radius: var(--radius);
            padding: 0.5rem;
            text-align: center;
            overflow-x: auto;
        }
        .dark .diagram { background: #1e293b; }

        /* Code blocks */
        pre {
            border-radius: var(--radius);
            margin: 0.5rem 0;
            font-size: 0.85rem;
            position: relative;
        }
        .code-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.4rem 0.75rem;
            background: #334155;
            color: #e2e8f0;
            border-radius: var(--radius) var(--radius) 0 0;
            font-size: 0.8rem;
            font-weight: 500;
        }
        pre.code-block { margin-top: 0; border-radius: 0 0 var(--radius) var(--radius); }

        /* Collapsible trigger */
        .collapse-trigger {
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }
        .collapse-trigger::before {
            content: '▼';
            font-size: 0.7rem;
            transition: transform var(--transition);
        }
        .collapsed .collapse-trigger::before { transform: rotate(-90deg); }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: #1e293b;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            z-index: 1000;
            opacity: 0;
            transform: translateY(0.5rem);
            transition: all 0.3s ease;
            pointer-events: none;
        }

        .no-results {
            text-align: center;
            padding: 2rem;
            color: var(--text-secondary);
            font-style: italic;

        /* Scrollbar */

        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }

        /* Responsive */
        @media (max-width: 600px) {
            .header { flex-direction: column; align-items: stretch; }
            .header h1 { text-align: center; }
            .search-box { max-width: none; }
            .tag-filter-bar { padding: 0.5rem 1rem; }
            .container { padding: 1rem; }
        }
    </style>
</head>

        // ==================== STATE ====================
        let darkMode = localStorage.getItem('darkMode') === 'true';
        let favoritesOnly = false;
        let activeTag = null;
        let collapsedCards = new Set();

        // ==================== INIT ====================
        function init() {
            applyDarkMode();
            renderAll();
            setupEventListeners();
            mermaid.initialize({ startOnLoad: true, theme: darkMode ? 'dark' : 'default' });
        }

        function applyDarkMode() {
            if (darkMode) {
                document.body.classList.add('dark');
                document.getElementById('darkModeToggle').textContent = '☀️';
            } else {
                document.body.classList.remove('dark');
                document.getElementById('darkModeToggle').textContent = '🌓';
            }
        }

        function toggleDarkMode() {
            darkMode = !darkMode;
            localStorage.setItem('darkMode', darkMode);
            applyDarkMode();
            // Re-render Mermaid diagrams with new theme
            renderAll();
        }

        // ==================== RENDER ====================
        function renderAll() {
            renderTagFilters();
            renderPatterns();
            if (typeof mermaid !== 'undefined') {
                mermaid.run({ querySelector: '.mermaid' });
            }
            if (typeof Prism !== 'undefined') {
                Prism.highlightAll();
            }
        }

        function getFilteredPatterns() {
            let filtered = patternsData;
            // Filter by favorites
            if (favoritesOnly) {
                filtered = filtered.filter(p => p.favorite);
            }
            // Filter by active tag
            if (activeTag) {
                filtered = filtered.filter(p => p.tags.includes(activeTag));
            }
            // Fuzzy search
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            if (query) {
                const fuse = new Fuse(filtered, {
                    keys: ['title', 'subtitle', 'tags', 'section', 'content'],
                    threshold: 0.4,
                    distance: 100,
                });
                filtered = fuse.search(query).map(r => r.item);
            }
            return filtered;
        }

        function renderPatterns() {
            const container = document.getElementById('mainContainer');
            const filtered = getFilteredPatterns();

            if (filtered.length === 0) {
                container.innerHTML = '<div class="no-results">No patterns match your filter/search criteria. Try adjusting your query or clearing filters.</div>';
                return;
            }

            // Group by section
            const sections = {};
            filtered.forEach(p => {
                if (!sections[p.section]) sections[p.section] = [];
                sections[p.section].push(p);
            });

            let html = '';
            for (const [sectionName, patterns] of Object.entries(sections)) {
                const icon = patterns[0]?.icon || '📌';
                html += `<div class="section">
                    <div class="section-title"><span class="icon">${icon}</span> ${sectionName}</div>
                    <div class="patterns-grid">`;
                patterns.forEach(p => {
                    const isCollapsed = collapsedCards.has(p.id);
                    const isFav = p.favorite;
                    const tagsHtml = p.tags.map(t => `<span class="card-tag">#${t}</span>`).join('');
                    html += `
                    <div class="pattern-card${isCollapsed ? ' collapsed' : ''}" id="card-${p.id}" data-id="${p.id}">
                        <div class="card-actions">
                            <button class="icon-btn copy-btn" title="Copy content" onclick="copyCardContent('${p.id}')">📋</button>
                            <button class="icon-btn${isFav ? ' favorited' : ''}" title="Toggle favorite" onclick="toggleFavorite('${p.id}')">⭐</button>
                        </div>
                        <div class="card-header collapse-trigger" onclick="toggleCollapse('${p.id}')">
                            <div>
                                <div class="card-title">${p.title}</div>
                                <div class="card-subtitle">${p.subtitle}</div>
                                <div class="card-tags">${tagsHtml}</div>
                            </div>
                        </div>
                        <div class="card-body">
                            ${p.content || ''}
                            ${p.code ? `
                                <div class="code-header">
                                    <span>🐍 Python Example</span>
                                    <button class="icon-btn" onclick="copyCode('${p.id}')" title="Copy code">📋</button>
                                </div>
                                <pre class="code-block language-python"><code id="code-${p.id}">${escapeHtml(p.code)}</code></pre>
                            ` : ''}
                        </div>
                    </div>`;
                });
                html += '</div></div>';
            }
            container.innerHTML = html;
            // Re-run Prism and Mermaid
            setTimeout(() => {
                if (typeof Prism !== 'undefined') Prism.highlightAll();
                if (typeof mermaid !== 'undefined') mermaid.run({ querySelector: '.mermaid' });
            }, 100);
        }

        function renderTagFilters() {
            const allTags = new Set();
            patternsData.forEach(p => p.tags.forEach(t => allTags.add(t)));
            const sortedTags = Array.from(allTags).sort();
            const bar = document.getElementById('tagFilterBar');
            bar.innerHTML = sortedTags.map(t => {
                const isActive = activeTag === t;
                return `<span class="tag-chip${isActive ? ' active' : ''}" data-tag="${t}" onclick="toggleTag('${t}')">#${t}</span>`;
            }).join('') + (activeTag ? '<span class="tag-chip" onclick="clearTag()">✕ Clear filter</span>' : '');
        }

        // ==================== ACTIONS ====================
        function toggleFavorite(id) {
            const pattern = patternsData.find(p => p.id === id);
            if (pattern) {
                pattern.favorite = !pattern.favorite;
                renderAll();
            }
        }

        function toggleCollapse(id) {
            if (collapsedCards.has(id)) {
                collapsedCards.delete(id);
            } else {
                collapsedCards.add(id);
            }
            renderAll();
        }

        function collapseAll() {
            const filtered = getFilteredPatterns();
            if (collapsedCards.size === filtered.length) {
                collapsedCards.clear();
            } else {
                filtered.forEach(p => collapsedCards.add(p.id));
            }
            renderAll();
        }

        function toggleTag(tag) {
            activeTag = activeTag === tag ? null : tag;
            renderAll();
        }

        function clearTag() {
            activeTag = null;
            renderAll();
        }

        function copyCardContent(id) {
            const card = document.getElementById(`card-${id}`);
            if (!card) return;
            const body = card.querySelector('.card-body');
            const text = body ? body.innerText : '';
            copyToClipboard(text);
        }

        function copyCode(id) {
            const codeElem = document.getElementById(`code-${id}`);
            if (codeElem) {
                copyToClipboard(codeElem.innerText);
            }
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                showToast();
            });
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        // ==================== EVENT LISTENERS ====================
        function setupEventListeners() {
            document.getElementById('darkModeToggle').addEventListener('click', toggleDarkMode);
            document.getElementById('favoritesToggle').addEventListener('click', () => {
                favoritesOnly = !favoritesOnly;
                document.getElementById('favoritesToggle').classList.toggle('active', favoritesOnly);
                renderAll();
            });
            document.getElementById('collapseAllBtn').addEventListener('click', collapseAll);
            document.getElementById('searchInput').addEventListener('input', renderAll);
            // Keyboard shortcut for search
            document.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                    e.preventDefault();
                    document.getElementById('searchInput').focus();
                }
            });
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.appendChild(document.createTextNode(str));
            return div.innerHTML;
        }

        // ==================== START ====================
        document.addEventListener('DOMContentLoaded', init);
    </script>
