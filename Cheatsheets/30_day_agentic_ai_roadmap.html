        ${p.days.map(d=>renderDay(d,p)).join('')}

}

        style="display:inline-flex;align-items:center;gap:6px;padding:8px 14px;background:#F9AB00;color:#412402;border-radius:var(--border-radius-md);font-size:12px;font-weight:500;text-decoration:none">
        <i class="ti ti-player-play" style="font-size:13px" aria-hidden="true"></i>
        Open in Colab
        <span style="font-size:10px;background:rgba(0,0,0,0.1);padding:2px 6px;border-radius:4px;color:#412402">
          ${d.official?'official':'new notebook'}
        </span>
      </a>
    </div>`;
}

function setFilter(id){filter=(id===filter?null:id);expanded=null;render();}
function toggleDay(day){expanded=(expanded===day?null:day);render();}

render();
</script>
